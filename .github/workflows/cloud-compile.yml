name: Cloud Compile

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build job ID'
        required: true
        type: string
      project_id:
        description: 'Project ID'
        required: true
        type: string
      language:
        description: 'Language (python or nodejs)'
        required: true
        type: string
      target_platforms:
        description: 'List of platforms to build for (e.g. windows,macos,linux)'
        required: true
        type: string
        default: 'windows'
      source_url:
        description: 'R2 presigned URL for source download'
        required: true
        type: string
      config_json:
        description: 'Build configuration JSON'
        required: true
        type: string
      callback_url:
        description: 'Webhook URL for completion'
        required: true
        type: string
      callback_secret:
        description: 'HMAC secret for webhook'
        required: true
        type: string

jobs:
  build-windows:
    if: contains(github.event.inputs.target_platforms, 'windows')
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Setup Python
        if: ${{ github.event.inputs.language == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Enable standard pip caching
      
      - name: Setup Node.js
        if: ${{ github.event.inputs.language == 'nodejs' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # Enable standard npm caching
      
      - name: Install Nuitka (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          pip install nuitka ordered-set zstandard
          pip install requests cryptography
      
      - name: Install pkg (Node.js)
        if: ${{ github.event.inputs.language == 'nodejs' }}
        run: npm install -g pkg
      
      - name: Download source code
        run: |
          curl -o source.zip "${{ github.event.inputs.source_url }}"
          Expand-Archive -Path source.zip -DestinationPath ./project
        shell: pwsh
      
      - name: Parse config
        id: prepare
        run: |
          $config = '${{ github.event.inputs.config_json }}' | ConvertFrom-Json
          echo "entry_file=$($config.entry_file)" >> $env:GITHUB_OUTPUT
          echo "output_name=$($config.output_name)" >> $env:GITHUB_OUTPUT
        shell: pwsh
      
      - name: Install project dependencies (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          cd project/source
          if (Test-Path "requirements.txt") {
            Write-Host "Installing dependencies from requirements.txt..."
            pip install -r requirements.txt
          } else {
            Write-Host "No requirements.txt found, skipping dependency install"
          }
        shell: pwsh
      
      - name: Inject license wrapper (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          # Download the wrapper template from the repo
          $wrapperUrl = "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/workflows/wrapper_python.py"
          Invoke-WebRequest -Uri $wrapperUrl -OutFile wrapper_template.py
          
          # Read wrapper and entry file
          $wrapper = Get-Content wrapper_template.py -Raw
          $config = '${{ github.event.inputs.config_json }}' | ConvertFrom-Json
          $entryPath = "project/source/${{ steps.prepare.outputs.entry_file }}"
          $originalCode = Get-Content $entryPath -Raw
          
          # Replace placeholders in wrapper
          $wrapper = $wrapper -replace '__LICENSE_KEY__', $config.license_key
          $wrapper = $wrapper -replace '__API_URL__', $config.api_url
          
          # Combine wrapper + original code
          $combined = $wrapper + "`n`n" + $originalCode
          Set-Content -Path $entryPath -Value $combined -Encoding UTF8
          Write-Host "Injected license wrapper into ${{ steps.prepare.outputs.entry_file }}"
        shell: pwsh
      
      - name: Compile with Nuitka
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          cd project/source
          python -m nuitka `
            --standalone `
            --onefile `
            --assume-yes-for-downloads `
            --windows-disable-console=false `
            --output-filename="${{ steps.prepare.outputs.output_name }}.exe" `
            "${{ steps.prepare.outputs.entry_file }}"
        shell: pwsh

      - name: Compile with pkg
        if: ${{ github.event.inputs.language == 'nodejs' }}
        run: |
          cd project/source
          npm install --production
          pkg . --targets node18-win-x64 --output "${{ steps.prepare.outputs.output_name }}.exe"
        shell: pwsh
      
      - name: Upload to R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          $exe = Get-ChildItem -Path "./project/source" -Filter "*.exe" | Select-Object -First 1
          
          aws configure set aws_access_key_id $env:R2_ACCESS_KEY
          aws configure set aws_secret_access_key $env:R2_SECRET_KEY
          
          $key = "builds/${{ github.event.inputs.build_id }}/windows/$($exe.Name)"
          aws s3 cp $exe.FullName "s3://$env:R2_BUCKET/$key" --endpoint-url $env:R2_ENDPOINT
          
          echo "UPLOAD_KEY=$key" >> $env:GITHUB_ENV
          echo "UPLOAD_FILENAME=$($exe.Name)" >> $env:GITHUB_ENV
        shell: pwsh
      
      - name: Notify completion
        if: always()
        run: |
          $status = if ($env:UPLOAD_KEY) { "completed" } else { "failed" }
          
          $body = @{
            build_id = "${{ github.event.inputs.build_id }}"
            platform = "windows"
            status = $status
            download_key = $env:UPLOAD_KEY
            filename = $env:UPLOAD_FILENAME
            error = if ($status -eq "failed") { "Compilation failed" } else { $null }
          } | ConvertTo-Json -Compress
          
          # Create HMAC signature
          $secret = "${{ github.event.inputs.callback_secret }}"
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($secret)
          $signature = [System.BitConverter]::ToString($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($body))).Replace("-", "").ToLower()
          
          Invoke-RestMethod -Uri "${{ github.event.inputs.callback_url }}" `
            -Method POST `
            -ContentType "application/json" `
            -Headers @{ "X-Signature" = $signature } `
            -Body $body
        shell: pwsh

  build-linux:
    if: contains(github.event.inputs.target_platforms, 'linux')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Setup Python
        if: ${{ github.event.inputs.language == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Setup Node.js
        if: ${{ github.event.inputs.language == 'nodejs' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          pip install nuitka ordered-set zstandard requests cryptography

      - name: Install pkg
        if: ${{ github.event.inputs.language == 'nodejs' }}
        run: npm install -g pkg

      - name: Download source code
        run: |
          curl -L -o source.zip "${{ github.event.inputs.source_url }}"
          unzip source.zip -d ./project

      - name: Parse config
        id: prepare
        run: |
          config=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin)['entry_file'])")
          output=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin)['output_name'])")
          echo "entry_file=$config" >> $GITHUB_OUTPUT
          echo "output_name=$output" >> $GITHUB_OUTPUT

      - name: Install project dependencies (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          cd project/source
          if [ -f "requirements.txt" ]; then
            echo "Installing dependencies from requirements.txt..."
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping dependency install"
          fi

      - name: Inject license wrapper (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/workflows/wrapper_python.py" -o wrapper_template.py
          license_key=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin).get('license_key', 'GENERIC_BUILD'))")
          api_url=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin).get('api_url', ''))")
          entry_file="project/source/${{ steps.prepare.outputs.entry_file }}"
          python3 -c "
          with open('wrapper_template.py', 'r') as f:
              wrapper = f.read()
          wrapper = wrapper.replace('__LICENSE_KEY__', '$license_key').replace('__API_URL__', '$api_url')
          with open('$entry_file', 'r') as f:
              original = f.read()
          with open('$entry_file', 'w') as f:
              f.write(wrapper + '\n\n' + original)
          print('Injected license wrapper')
          "

      - name: Compile with Nuitka
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          cd project/source
          python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --output-filename="${{ steps.prepare.outputs.output_name }}" \
            "${{ steps.prepare.outputs.entry_file }}"

      - name: Compile with pkg
        if: ${{ github.event.inputs.language == 'nodejs' }}
        run: |
          cd project/source
          npm install --production
          pkg . --targets node18-linux-x64 --output "${{ steps.prepare.outputs.output_name }}"

      - name: Package Output
        run: |
          cd project/source
          chmod +x "${{ steps.prepare.outputs.output_name }}"
          tar -czvf "${{ steps.prepare.outputs.output_name }}.tar.gz" "${{ steps.prepare.outputs.output_name }}"

      - name: Upload to R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          cd project/source
          # Find the tar.gz
          artifact=$(ls *.tar.gz | head -1)
          
          # Install AWS CLI
          pip install awscli
          aws configure set aws_access_key_id $R2_ACCESS_KEY
          aws configure set aws_secret_access_key $R2_SECRET_KEY
          
          key="builds/${{ github.event.inputs.build_id }}/linux/$artifact"
          aws s3 cp "$artifact" "s3://$R2_BUCKET/$key" --endpoint-url $R2_ENDPOINT
          
          echo "UPLOAD_KEY=$key" >> $GITHUB_ENV
          echo "UPLOAD_FILENAME=$artifact" >> $GITHUB_ENV

      - name: Notify completion
        if: always()
        run: |
          if [ -n "$UPLOAD_KEY" ]; then status="completed"; else status="failed"; fi
          
          payload=$(cat << EOF
          {
            "build_id": "${{ github.event.inputs.build_id }}",
            "platform": "linux",
            "status": "$status",
            "download_key": "$UPLOAD_KEY",
            "filename": "$UPLOAD_FILENAME",
            "error": null
          }
          EOF
          )
          
          signature=$(echo -n "$payload" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callback_secret }}" | awk '{print $2}')
          
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $signature" \
            -d "$payload"

  build-macos:
    if: contains(github.event.inputs.target_platforms, 'macos')
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
      - name: Setup Python
        if: ${{ github.event.inputs.language == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Setup Node.js
        if: ${{ github.event.inputs.language == 'nodejs' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ github.event.inputs.language == 'python' }}
        run: pip install nuitka ordered-set zstandard requests cryptography

      - name: Install pkg
        if: ${{ github.event.inputs.language == 'nodejs' }}
        run: npm install -g pkg

      - name: Download source code
        run: |
          curl -L -o source.zip "${{ github.event.inputs.source_url }}"
          unzip source.zip -d ./project

      - name: Parse config
        id: prepare
        run: |
          config=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin)['entry_file'])")
          output=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin)['output_name'])")
          echo "entry_file=$config" >> $GITHUB_OUTPUT
          echo "output_name=$output" >> $GITHUB_OUTPUT

      - name: Install project dependencies (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          cd project/source
          if [ -f "requirements.txt" ]; then
            echo "Installing dependencies from requirements.txt..."
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping dependency install"
          fi

      - name: Inject license wrapper (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/workflows/wrapper_python.py" -o wrapper_template.py
          license_key=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin).get('license_key', 'GENERIC_BUILD'))")
          api_url=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin).get('api_url', ''))")
          entry_file="project/source/${{ steps.prepare.outputs.entry_file }}"
          python3 -c "
          with open('wrapper_template.py', 'r') as f:
              wrapper = f.read()
          wrapper = wrapper.replace('__LICENSE_KEY__', '$license_key').replace('__API_URL__', '$api_url')
          with open('$entry_file', 'r') as f:
              original = f.read()
          with open('$entry_file', 'w') as f:
              f.write(wrapper + '\n\n' + original)
          print('Injected license wrapper')
          "

      - name: Compile with Nuitka
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          cd project/source
          python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --macos-create-app-bundle \
            --output-filename="${{ steps.prepare.outputs.output_name }}" \
            "${{ steps.prepare.outputs.entry_file }}"

      - name: Compile with pkg
        if: ${{ github.event.inputs.language == 'nodejs' }}
        run: |
          cd project/source
          npm install --production
          pkg . --targets node18-macos-x64 --output "${{ steps.prepare.outputs.output_name }}"

      - name: Package Output (Zip App)
        run: |
          cd project/source
          if [ -d "${{ steps.prepare.outputs.output_name }}.app" ]; then
             zip -r "${{ steps.prepare.outputs.output_name }}_macos.zip" "${{ steps.prepare.outputs.output_name }}.app"
             echo "ARTIFACT_NAME=${{ steps.prepare.outputs.output_name }}_macos.zip" >> $GITHUB_ENV
          else
             # For pkg or binary
             chmod +x "${{ steps.prepare.outputs.output_name }}"
             zip -r "${{ steps.prepare.outputs.output_name }}_macos.zip" "${{ steps.prepare.outputs.output_name }}"
             echo "ARTIFACT_NAME=${{ steps.prepare.outputs.output_name }}_macos.zip" >> $GITHUB_ENV
          fi

      - name: Upload to R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          cd project/source
          artifact=$ARTIFACT_NAME
          
          pip install awscli
          aws configure set aws_access_key_id $R2_ACCESS_KEY
          aws configure set aws_secret_access_key $R2_SECRET_KEY
          
          key="builds/${{ github.event.inputs.build_id }}/macos/$artifact"
          aws s3 cp "$artifact" "s3://$R2_BUCKET/$key" --endpoint-url $R2_ENDPOINT
          
          echo "UPLOAD_KEY=$key" >> $GITHUB_ENV
          echo "UPLOAD_FILENAME=$artifact" >> $GITHUB_ENV

      - name: Notify completion
        if: always()
        run: |
          if [ -n "$UPLOAD_KEY" ]; then status="completed"; else status="failed"; fi
          
          payload=$(cat << EOF
          {
            "build_id": "${{ github.event.inputs.build_id }}",
            "platform": "macos",
            "status": "$status",
            "download_key": "$UPLOAD_KEY",
            "filename": "$UPLOAD_FILENAME",
            "error": null
          }
          EOF
          )
          
          signature=$(echo -n "$payload" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callback_secret }}" | awk '{print $2}')
          
          curl -X POST "${{ github.event.inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $signature" \
            -d "$payload"
