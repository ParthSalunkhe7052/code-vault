name: Cloud Compile

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build job ID'
        required: true
        type: string
      project_id:
        description: 'Project ID'
        required: true
        type: string
      language:
        description: 'Language (python or nodejs)'
        required: true
        type: string
      target_platforms:
        description: 'List of platforms to build for (e.g. windows,macos,linux)'
        required: true
        type: string
        default: 'windows'
      source_url:
        description: 'R2 presigned URL for source download'
        required: true
        type: string
      config_json:
        description: 'Build configuration JSON'
        required: true
        type: string
      callback_url:
        description: 'Webhook URL for completion'
        required: true
        type: string
      callback_secret:
        description: 'HMAC secret for webhook'
        required: true
        type: string
      plan_tier:
        description: 'User plan tier (free/pro/enterprise)'
        required: false
        type: string
        default: 'free'

jobs:
  build-windows:
    if: contains(github.event.inputs.target_platforms, 'windows')
    runs-on: windows-latest
    timeout-minutes: ${{ github.event.inputs.plan_tier == 'enterprise' && 120 || 60 }}
    
    steps:
      - name: Update progress - Starting
        run: |
          $body = @{
            build_id = "${{ github.event.inputs.build_id }}"
            platform = "windows"
            progress = 5
            stage = "Starting build"
            github_run_id = "${{ github.run_id }}"
          } | ConvertTo-Json -Compress
          
          $secret = "${{ github.event.inputs.callback_secret }}"
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($secret)
          $signature = [System.BitConverter]::ToString($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($body))).Replace("-", "").ToLower()
          
          try {
            Invoke-RestMethod -Uri "${{ github.event.inputs.callback_url }}/progress" `
              -Method POST `
              -ContentType "application/json" `
              -Headers @{ "X-Signature" = $signature } `
              -Body $body
          } catch { Write-Host "Progress update failed (non-critical)" }
        shell: pwsh
        continue-on-error: true

      - name: Setup Python
        if: ${{ github.event.inputs.language == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Node.js
        if: ${{ github.event.inputs.language == 'nodejs' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Cache pip packages
        if: ${{ github.event.inputs.language == 'python' }}
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: windows-pip-nuitka-${{ hashFiles('.github/workflows/cloud-compile.yml') }}
          restore-keys: |
            windows-pip-nuitka-
      
      - name: Cache npm packages
        if: ${{ github.event.inputs.language == 'nodejs' }}
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\npm-cache
          key: windows-npm-pkg-${{ hashFiles('.github/workflows/cloud-compile.yml') }}
          restore-keys: |
            windows-npm-pkg-
      
      - name: Install Nuitka (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          pip install nuitka ordered-set zstandard
          pip install requests cryptography
      
      - name: Install pkg (Node.js)
        if: ${{ github.event.inputs.language == 'nodejs' }}
        run: npm install -g pkg
      
      - name: Download source code
        run: |
          curl -o source.zip "${{ github.event.inputs.source_url }}"
          Expand-Archive -Path source.zip -DestinationPath ./project
        shell: pwsh

      - name: Normalize source directory structure
        run: |
          if (Test-Path "./project/source") {
            Write-Host "Source directory found at ./project/source"
          } elseif ((Get-ChildItem ./project -File -ErrorAction SilentlyContinue | Measure-Object).Count -gt 0) {
            Write-Host "Source files in ./project root, moving to source subfolder"
            New-Item -ItemType Directory -Force -Path "./project/source" | Out-Null
            Get-ChildItem ./project -Exclude source | Move-Item -Destination "./project/source" -Force
          } else {
            $subfolders = Get-ChildItem ./project -Directory -ErrorAction SilentlyContinue
            if ($subfolders.Count -eq 1) {
              Move-Item -Path $subfolders[0].FullName -Destination "./project/source" -Force
            } else {
              Write-Host "ERROR: Could not determine source structure"
              Write-Host "Contents of ./project:"
              Get-ChildItem ./project -Force | Format-Table Name, Mode
              exit 1
            }
          }
        shell: pwsh

      - name: Update progress - Source downloaded
        run: |
          $body = @{ build_id = "${{ github.event.inputs.build_id }}"; platform = "windows"; progress = 15; stage = "Downloading source" } | ConvertTo-Json -Compress
          $secret = "${{ github.event.inputs.callback_secret }}"
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($secret)
          $signature = [System.BitConverter]::ToString($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($body))).Replace("-", "").ToLower()
          try { Invoke-RestMethod -Uri "${{ github.event.inputs.callback_url }}/progress" -Method POST -ContentType "application/json" -Headers @{ "X-Signature" = $signature } -Body $body } catch {}
        shell: pwsh
        continue-on-error: true
      
      - name: Parse config
        id: prepare
        run: |
          $config = '${{ github.event.inputs.config_json }}' | ConvertFrom-Json
          echo "entry_file=$($config.entry_file)" >> $env:GITHUB_OUTPUT
          echo "output_name=$($config.output_name)" >> $env:GITHUB_OUTPUT
        shell: pwsh
      
      - name: Install project dependencies (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          cd project/source
          if (Test-Path "requirements.txt") {
            Write-Host "Installing dependencies from requirements.txt..."
            # Filter out ta-lib which requires C libraries
            $content = Get-Content requirements.txt
            $filtered = $content | Where-Object { 
              $_ -notmatch '^\s*(ta-lib|TA-Lib)\s*' -and 
              $_ -notmatch '^\s*#' -and
              $_.Trim() -ne ''
            }
            
            if ($filtered) {
              $filtered | Set-Content requirements_filtered.txt
              pip install -r requirements_filtered.txt
              
              # Check if ta-lib was skipped
              if ($content -match 'ta-lib') {
                Write-Host "WARNING: ta-lib requires C libraries. Skipping."
                echo "TALIB_SKIPPED=true" >> $env:GITHUB_ENV
              }
            }
          } else {
            Write-Host "No requirements.txt found, skipping dependency install"
          }
        shell: pwsh
      
      - name: Update progress - Dependencies
        run: |
          $body = @{ build_id = "${{ github.event.inputs.build_id }}"; platform = "windows"; progress = 25; stage = "Installing dependencies" } | ConvertTo-Json -Compress
          $secret = "${{ github.event.inputs.callback_secret }}"
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($secret)
          $signature = [System.BitConverter]::ToString($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($body))).Replace("-", "").ToLower()
          try { Invoke-RestMethod -Uri "${{ github.event.inputs.callback_url }}/progress" -Method POST -ContentType "application/json" -Headers @{ "X-Signature" = $signature } -Body $body } catch {}
        shell: pwsh
        continue-on-error: true
      
      - name: Inject license wrapper (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          $wrapperUrl = "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/workflows/wrapper_python.py"
          Invoke-WebRequest -Uri $wrapperUrl -OutFile wrapper_template.py
          
          $wrapper = Get-Content wrapper_template.py -Raw
          $config = '${{ github.event.inputs.config_json }}' | ConvertFrom-Json
          $entryPath = "project/source/${{ steps.prepare.outputs.entry_file }}"
          $originalCode = Get-Content $entryPath -Raw
          
          $wrapper = $wrapper -replace '__LICENSE_KEY__', $config.license_key
          $wrapper = $wrapper -replace '__API_URL__', $config.api_url
          
          $combined = $wrapper + "`n`n" + $originalCode
          Set-Content -Path $entryPath -Value $combined -Encoding UTF8
          Write-Host "Injected license wrapper into ${{ steps.prepare.outputs.entry_file }}"
        shell: pwsh
      
      - name: Update progress - Wrapper injected
        run: |
          $body = @{ build_id = "${{ github.event.inputs.build_id }}"; platform = "windows"; progress = 35; stage = "Injecting license protection" } | ConvertTo-Json -Compress
          $secret = "${{ github.event.inputs.callback_secret }}"
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($secret)
          $signature = [System.BitConverter]::ToString($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($body))).Replace("-", "").ToLower()
          try { Invoke-RestMethod -Uri "${{ github.event.inputs.callback_url }}/progress" -Method POST -ContentType "application/json" -Headers @{ "X-Signature" = $signature } -Body $body } catch {}
        shell: pwsh
        continue-on-error: true

      - name: Update progress - Compilation starting
        run: |
          $body = @{ build_id = "${{ github.event.inputs.build_id }}"; platform = "windows"; progress = 45; stage = "Starting compilation" } | ConvertTo-Json -Compress
          $secret = "${{ github.event.inputs.callback_secret }}"
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($secret)
          $signature = [System.BitConverter]::ToString($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($body))).Replace("-", "").ToLower()
          try { Invoke-RestMethod -Uri "${{ github.event.inputs.callback_url }}/progress" -Method POST -ContentType "application/json" -Headers @{ "X-Signature" = $signature } -Body $body } catch {}
        shell: pwsh
        continue-on-error: true
      
      - name: Compile with Nuitka
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          cd project/source
          python -m nuitka `
            --standalone `
            --onefile `
            --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --noinclude-unittest-mode=nofollow `
            --noinclude-pytest-mode=nofollow `
            --output-filename="${{ steps.prepare.outputs.output_name }}.exe" `
            "${{ steps.prepare.outputs.entry_file }}"
        shell: pwsh

      - name: Compile with pkg
        if: ${{ github.event.inputs.language == 'nodejs' }}
        run: |
          cd project/source
          npm install --production
          pkg . --targets node18-win-x64 --output "${{ steps.prepare.outputs.output_name }}.exe"
        shell: pwsh
      
      - name: Update progress - Compiled
        run: |
          $body = @{ build_id = "${{ github.event.inputs.build_id }}"; platform = "windows"; progress = 80; stage = "Compiling binary" } | ConvertTo-Json -Compress
          $secret = "${{ github.event.inputs.callback_secret }}"
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($secret)
          $signature = [System.BitConverter]::ToString($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($body))).Replace("-", "").ToLower()
          try { Invoke-RestMethod -Uri "${{ github.event.inputs.callback_url }}/progress" -Method POST -ContentType "application/json" -Headers @{ "X-Signature" = $signature } -Body $body } catch {}
        shell: pwsh
        continue-on-error: true

      - name: Update progress - Starting upload
        run: |
          $body = @{ build_id = "${{ github.event.inputs.build_id }}"; platform = "windows"; progress = 85; stage = "Uploading artifact" } | ConvertTo-Json -Compress
          $secret = "${{ github.event.inputs.callback_secret }}"
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($secret)
          $signature = [System.BitConverter]::ToString($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($body))).Replace("-", "").ToLower()
          try { Invoke-RestMethod -Uri "${{ github.event.inputs.callback_url }}/progress" -Method POST -ContentType "application/json" -Headers @{ "X-Signature" = $signature } -Body $body } catch {}
        shell: pwsh
        continue-on-error: true
      
      - name: Upload to R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          $exe = Get-ChildItem -Path "./project/source" -Filter "*.exe" | Select-Object -First 1
          
          aws configure set aws_access_key_id $env:R2_ACCESS_KEY
          aws configure set aws_secret_access_key $env:R2_SECRET_KEY
          
          $key = "builds/${{ github.event.inputs.build_id }}/windows/$($exe.Name)"
          aws s3 cp $exe.FullName "s3://$env:R2_BUCKET/$key" --endpoint-url $env:R2_ENDPOINT
          
          echo "UPLOAD_KEY=$key" >> $env:GITHUB_ENV
          echo "UPLOAD_FILENAME=$($exe.Name)" >> $env:GITHUB_ENV
        shell: pwsh
      
      - name: Notify completion
        if: always()
        continue-on-error: true
        run: |
          $status = if ($env:UPLOAD_KEY) { "completed" } else { "failed" }
          
          # Capture detailed error message based on job outcome
          $errorMsg = $null
          if ($status -eq "failed") {
            if ($env:TALIB_SKIPPED -eq "true") {
              $errorMsg = "Build failed: Project requires ta-lib which needs system libraries. Please remove ta-lib dependency or use Docker builds."
            } elseif (-not (Test-Path "project/source/${{ steps.prepare.outputs.entry_file }}")) {
              $errorMsg = "Build failed: Entry file not found"
            } else {
              $errorMsg = "Compilation failed. Check GitHub Actions logs."
            }
          }
          
          $body = @{
            build_id = "${{ github.event.inputs.build_id }}"
            platform = "windows"
            status = $status
            download_key = $env:UPLOAD_KEY
            filename = $env:UPLOAD_FILENAME
            error = $errorMsg
            github_run_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | ConvertTo-Json -Compress
          
          $secret = "${{ github.event.inputs.callback_secret }}"
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($secret)
          $signature = [System.BitConverter]::ToString($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($body))).Replace("-", "").ToLower()
          
          # Retry webhook delivery
          $maxRetries = 3
          $retryCount = 0
          $success = $false
          
          while (-not $success -and $retryCount -lt $maxRetries) {
            try {
              Invoke-RestMethod -Uri "${{ github.event.inputs.callback_url }}" `
                -Method POST `
                -ContentType "application/json" `
                -Headers @{ "X-Signature" = $signature } `
                -Body $body `
                -TimeoutSec 10
              $success = $true
              Write-Host "Webhook delivered successfully"
            } catch {
              $retryCount++
              Write-Host "Webhook failed (attempt $retryCount/$maxRetries): $($_.Exception.Message)"
              Start-Sleep -Seconds 2
            }
          }
        shell: pwsh

  build-linux:
    if: contains(github.event.inputs.target_platforms, 'linux')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.plan_tier == 'enterprise' && 120 || 60 }}
    
    steps:
      - name: Update progress - Starting
        run: |
          payload='{"build_id":"${{ github.event.inputs.build_id }}","platform":"linux","progress":5,"stage":"Starting build","github_run_id":"${{ github.run_id }}"}'
          signature=$(echo -n "$payload" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callback_secret }}" | awk '{print $2}')
          curl -s -X POST "${{ github.event.inputs.callback_url }}/progress" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $signature" \
            -d "$payload" || true
        continue-on-error: true
      
      - name: Setup Python
        if: ${{ github.event.inputs.language == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Node.js
        if: ${{ github.event.inputs.language == 'nodejs' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Cache pip packages
        if: ${{ github.event.inputs.language == 'python' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: linux-pip-nuitka-${{ hashFiles('.github/workflows/cloud-compile.yml') }}
          restore-keys: |
            linux-pip-nuitka-
      
      - name: Cache npm packages
        if: ${{ github.event.inputs.language == 'nodejs' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: linux-npm-pkg-${{ hashFiles('.github/workflows/cloud-compile.yml') }}
          restore-keys: |
            linux-npm-pkg-

      - name: Install dependencies
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf python3-tk
          pip install nuitka ordered-set zstandard requests cryptography

      - name: Install pkg
        if: ${{ github.event.inputs.language == 'nodejs' }}
        run: npm install -g pkg

      - name: Download source code
        run: |
          curl -L -o source.zip "${{ github.event.inputs.source_url }}"
          unzip source.zip -d ./project

      - name: Normalize source directory structure
        run: |
          if [ -d "./project/source" ]; then
            echo "Source directory found at ./project/source"
          elif [ "$(find ./project -maxdepth 1 -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "Source files in ./project root, moving to source subfolder"
            mkdir -p ./project/source
            find ./project -maxdepth 1 -type f -exec mv {} ./project/source/ \;
          else
            subfolders=$(find ./project -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l)
            if [ "$subfolders" -eq 1 ]; then
              subfolder=$(find ./project -maxdepth 1 -mindepth 1 -type d | head -1)
              mv "$subfolder" ./project/source
            else
              echo "ERROR: Could not determine source structure"
              ls -la ./project
              exit 1
            fi
          fi

      - name: Parse config
        id: prepare
        run: |
          config=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin)['entry_file'])")
          output=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin)['output_name'])")
          echo "entry_file=$config" >> $GITHUB_OUTPUT
          echo "output_name=$output" >> $GITHUB_OUTPUT

      - name: Install project dependencies (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          cd project/source
          if [ -f "requirements.txt" ]; then
            echo "Installing dependencies from requirements.txt..."
            # Filter out ta-lib which requires system libraries
            grep -vE '^\s*(ta-lib|TA-Lib)\s*' requirements.txt > requirements_filtered.txt || true
            
            if [ -s requirements_filtered.txt ]; then
              pip install -r requirements_filtered.txt
            fi
            
            # Check if ta-lib was in requirements
            if grep -qE '^\s*(ta-lib|TA-Lib)\s*' requirements.txt; then
              echo "WARNING: ta-lib requires system libraries. Skipping ta-lib installation."
              echo "TALIB_SKIPPED=true" >> $GITHUB_ENV
            fi
          else
            echo "No requirements.txt found, skipping dependency install"
          fi

      - name: Inject license wrapper (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/workflows/wrapper_python.py" -o wrapper_template.py
          license_key=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin).get('license_key', 'GENERIC_BUILD'))")
          api_url=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin).get('api_url', ''))")
          entry_file="project/source/${{ steps.prepare.outputs.entry_file }}"
          python3 -c "
          with open('wrapper_template.py', 'r') as f:
              wrapper = f.read()
          wrapper = wrapper.replace('__LICENSE_KEY__', '$license_key').replace('__API_URL__', '$api_url')
          with open('$entry_file', 'r') as f:
              original = f.read()
          with open('$entry_file', 'w') as f:
              f.write(wrapper + '\n\n' + original)
          print('Injected license wrapper')
          "

      - name: Update progress - Compilation starting
        run: |
          payload='{"build_id":"${{ github.event.inputs.build_id }}","platform":"linux","progress":45,"stage":"Starting compilation"}'
          signature=$(echo -n "$payload" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callback_secret }}" | awk '{print $2}')
          curl -s -X POST "${{ github.event.inputs.callback_url }}/progress" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $signature" \
            -d "$payload" || true
        continue-on-error: true

      - name: Compile with Nuitka
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          cd project/source
          python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --noinclude-unittest-mode=nofollow \
            --noinclude-pytest-mode=nofollow \
            --output-filename="${{ steps.prepare.outputs.output_name }}" \
            "${{ steps.prepare.outputs.entry_file }}"

      - name: Compile with pkg
        if: ${{ github.event.inputs.language == 'nodejs' }}
        run: |
          cd project/source
          npm install --production
          pkg . --targets node18-linux-x64 --output "${{ steps.prepare.outputs.output_name }}"

      - name: Package Output
        run: |
          cd project/source
          chmod +x "${{ steps.prepare.outputs.output_name }}"
          tar -czvf "${{ steps.prepare.outputs.output_name }}.tar.gz" "${{ steps.prepare.outputs.output_name }}"

      - name: Update progress - Starting upload
        run: |
          payload='{"build_id":"${{ github.event.inputs.build_id }}","platform":"linux","progress":85,"stage":"Uploading artifact"}'
          signature=$(echo -n "$payload" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callback_secret }}" | awk '{print $2}')
          curl -s -X POST "${{ github.event.inputs.callback_url }}/progress" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $signature" \
            -d "$payload" || true
        continue-on-error: true

      - name: Upload to R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          cd project/source
          artifact=$(ls *.tar.gz | head -1)
          
          pip install awscli
          aws configure set aws_access_key_id $R2_ACCESS_KEY
          aws configure set aws_secret_access_key $R2_SECRET_KEY
          
          key="builds/${{ github.event.inputs.build_id }}/linux/$artifact"
          aws s3 cp "$artifact" "s3://$R2_BUCKET/$key" --endpoint-url $R2_ENDPOINT
          
          echo "UPLOAD_KEY=$key" >> $GITHUB_ENV
          echo "UPLOAD_FILENAME=$artifact" >> $GITHUB_ENV

      - name: Notify completion
        if: always()
        continue-on-error: true
        run: |
          if [ -n "$UPLOAD_KEY" ]; then 
            status="completed"
            error_msg=""
          else 
            status="failed"
            # Capture detailed error message
            if [ "$TALIB_SKIPPED" = "true" ]; then
              error_msg="Build failed: Project requires ta-lib which needs system libraries. Please remove ta-lib dependency or use Docker builds."
            elif [ ! -f "project/source/${{ steps.prepare.outputs.entry_file }}" ]; then
              error_msg="Build failed: Entry file not found"
            else
              error_msg="Compilation failed. Check GitHub Actions logs."
            fi
          fi
          
          # Build JSON payload properly
          if [ -n "$error_msg" ]; then
            error_json="\"$error_msg\""
          else
            error_json="null"
          fi
          
          payload=$(cat << EOF
          {
            "build_id": "${{ github.event.inputs.build_id }}",
            "platform": "linux",
            "status": "$status",
            "download_key": "$UPLOAD_KEY",
            "filename": "$UPLOAD_FILENAME",
            "error": $error_json,
            "github_run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          )
          
          signature=$(echo -n "$payload" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callback_secret }}" | awk '{print $2}')
          
          # Retry webhook delivery
          max_retries=3
          retry_count=0
          success=false
          
          while [ "$success" = "false" ] && [ $retry_count -lt $max_retries ]; do
            if curl -sf -X POST "${{ github.event.inputs.callback_url }}" \
              -H "Content-Type: application/json" \
              -H "X-Signature: $signature" \
              --connect-timeout 10 \
              -d "$payload"; then
              success=true
              echo "Webhook delivered successfully"
            else
              retry_count=$((retry_count + 1))
              echo "Webhook failed (attempt $retry_count/$max_retries)"
              sleep 2
            fi
          done

  build-macos:
    if: contains(github.event.inputs.target_platforms, 'macos')
    runs-on: macos-latest
    timeout-minutes: ${{ github.event.inputs.plan_tier == 'enterprise' && 120 || 60 }}
    
    steps:
      - name: Update progress - Starting
        run: |
          payload='{"build_id":"${{ github.event.inputs.build_id }}","platform":"macos","progress":5,"stage":"Starting build","github_run_id":"${{ github.run_id }}"}'
          signature=$(echo -n "$payload" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callback_secret }}" | awk '{print $2}')
          curl -s -X POST "${{ github.event.inputs.callback_url }}/progress" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $signature" \
            -d "$payload" || true
        continue-on-error: true
      
      - name: Setup Python
        if: ${{ github.event.inputs.language == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Node.js
        if: ${{ github.event.inputs.language == 'nodejs' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Cache pip packages
        if: ${{ github.event.inputs.language == 'python' }}
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: macos-pip-nuitka-${{ hashFiles('.github/workflows/cloud-compile.yml') }}
          restore-keys: |
            macos-pip-nuitka-
      
      - name: Cache npm packages
        if: ${{ github.event.inputs.language == 'nodejs' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: macos-npm-pkg-${{ hashFiles('.github/workflows/cloud-compile.yml') }}
          restore-keys: |
            macos-npm-pkg-

      - name: Install dependencies
        if: ${{ github.event.inputs.language == 'python' }}
        run: pip install nuitka ordered-set zstandard requests cryptography

      - name: Install pkg
        if: ${{ github.event.inputs.language == 'nodejs' }}
        run: npm install -g pkg

      - name: Download source code
        run: |
          curl -L -o source.zip "${{ github.event.inputs.source_url }}"
          unzip source.zip -d ./project

      - name: Normalize source directory structure
        run: |
          if [ -d "./project/source" ]; then
            echo "Source directory found at ./project/source"
          elif [ "$(find ./project -maxdepth 1 -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "Source files in ./project root, moving to source subfolder"
            mkdir -p ./project/source
            find ./project -maxdepth 1 -type f -exec mv {} ./project/source/ \;
          else
            subfolders=$(find ./project -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l)
            if [ "$subfolders" -eq 1 ]; then
              subfolder=$(find ./project -maxdepth 1 -mindepth 1 -type d | head -1)
              mv "$subfolder" ./project/source
            else
              echo "ERROR: Could not determine source structure"
              ls -la ./project
              exit 1
            fi
          fi

      - name: Parse config
        id: prepare
        run: |
          config=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin)['entry_file'])")
          output=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin)['output_name'])")
          echo "entry_file=$config" >> $GITHUB_OUTPUT
          echo "output_name=$output" >> $GITHUB_OUTPUT

      - name: Install project dependencies (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          cd project/source
          if [ -f "requirements.txt" ]; then
            echo "Installing dependencies from requirements.txt..."
            # Filter out ta-lib which requires system libraries
            grep -vE '^\s*(ta-lib|TA-Lib)\s*' requirements.txt > requirements_filtered.txt || true
            
            if [ -s requirements_filtered.txt ]; then
              pip install -r requirements_filtered.txt
            fi
            
            # Check if ta-lib was in requirements
            if grep -qE '^\s*(ta-lib|TA-Lib)\s*' requirements.txt; then
              echo "WARNING: ta-lib requires system libraries. Skipping ta-lib installation."
              echo "TALIB_SKIPPED=true" >> $GITHUB_ENV
            fi
          else
            echo "No requirements.txt found, skipping dependency install"
          fi

      - name: Inject license wrapper (Python)
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/main/.github/workflows/wrapper_python.py" -o wrapper_template.py
          license_key=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin).get('license_key', 'GENERIC_BUILD'))")
          api_url=$(echo '${{ github.event.inputs.config_json }}' | python3 -c "import sys, json; print(json.load(sys.stdin).get('api_url', ''))")
          entry_file="project/source/${{ steps.prepare.outputs.entry_file }}"
          python3 -c "
          with open('wrapper_template.py', 'r') as f:
              wrapper = f.read()
          wrapper = wrapper.replace('__LICENSE_KEY__', '$license_key').replace('__API_URL__', '$api_url')
          with open('$entry_file', 'r') as f:
              original = f.read()
          with open('$entry_file', 'w') as f:
              f.write(wrapper + '\n\n' + original)
          print('Injected license wrapper')
          "

      - name: Update progress - Compilation starting
        run: |
          payload='{"build_id":"${{ github.event.inputs.build_id }}","platform":"macos","progress":45,"stage":"Starting compilation"}'
          signature=$(echo -n "$payload" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callback_secret }}" | awk '{print $2}')
          curl -s -X POST "${{ github.event.inputs.callback_url }}/progress" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $signature" \
            -d "$payload" || true
        continue-on-error: true

      - name: Compile with Nuitka
        if: ${{ github.event.inputs.language == 'python' }}
        run: |
          cd project/source
          python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --noinclude-unittest-mode=nofollow \
            --noinclude-pytest-mode=nofollow \
            --macos-create-app-bundle \
            --output-filename="${{ steps.prepare.outputs.output_name }}" \
            "${{ steps.prepare.outputs.entry_file }}"

      - name: Compile with pkg
        if: ${{ github.event.inputs.language == 'nodejs' }}
        run: |
          cd project/source
          npm install --production
          pkg . --targets node18-macos-x64 --output "${{ steps.prepare.outputs.output_name }}"

      - name: Package Output (Zip App)
        run: |
          cd project/source
          if [ -d "${{ steps.prepare.outputs.output_name }}.app" ]; then
             zip -r "${{ steps.prepare.outputs.output_name }}_macos.zip" "${{ steps.prepare.outputs.output_name }}.app"
             echo "ARTIFACT_NAME=${{ steps.prepare.outputs.output_name }}_macos.zip" >> $GITHUB_ENV
          else
             chmod +x "${{ steps.prepare.outputs.output_name }}"
             zip -r "${{ steps.prepare.outputs.output_name }}_macos.zip" "${{ steps.prepare.outputs.output_name }}"
             echo "ARTIFACT_NAME=${{ steps.prepare.outputs.output_name }}_macos.zip" >> $GITHUB_ENV
          fi

      - name: Update progress - Starting upload
        run: |
          payload='{"build_id":"${{ github.event.inputs.build_id }}","platform":"macos","progress":85,"stage":"Uploading artifact"}'
          signature=$(echo -n "$payload" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callback_secret }}" | awk '{print $2}')
          curl -s -X POST "${{ github.event.inputs.callback_url }}/progress" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $signature" \
            -d "$payload" || true
        continue-on-error: true

      - name: Upload to R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          cd project/source
          artifact=$ARTIFACT_NAME
          
          pip install awscli
          aws configure set aws_access_key_id $R2_ACCESS_KEY
          aws configure set aws_secret_access_key $R2_SECRET_KEY
          
          key="builds/${{ github.event.inputs.build_id }}/macos/$artifact"
          aws s3 cp "$artifact" "s3://$R2_BUCKET/$key" --endpoint-url $R2_ENDPOINT
          
          echo "UPLOAD_KEY=$key" >> $GITHUB_ENV
          echo "UPLOAD_FILENAME=$artifact" >> $GITHUB_ENV

      - name: Notify completion
        if: always()
        continue-on-error: true
        run: |
          if [ -n "$UPLOAD_KEY" ]; then 
            status="completed"
            error_msg=""
          else 
            status="failed"
            # Capture detailed error message
            if [ "$TALIB_SKIPPED" = "true" ]; then
              error_msg="Build failed: Project requires ta-lib which needs system libraries. Please remove ta-lib dependency or use Docker builds."
            elif [ ! -f "project/source/${{ steps.prepare.outputs.entry_file }}" ]; then
              error_msg="Build failed: Entry file not found"
            else
              error_msg="Compilation failed. Check GitHub Actions logs."
            fi
          fi
          
          # Build JSON payload properly
          if [ -n "$error_msg" ]; then
            error_json="\"$error_msg\""
          else
            error_json="null"
          fi
          
          payload=$(cat << EOF
          {
            "build_id": "${{ github.event.inputs.build_id }}",
            "platform": "macos",
            "status": "$status",
            "download_key": "$UPLOAD_KEY",
            "filename": "$UPLOAD_FILENAME",
            "error": $error_json,
            "github_run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          )
          
          signature=$(echo -n "$payload" | openssl dgst -sha256 -hmac "${{ github.event.inputs.callback_secret }}" | awk '{print $2}')
          
          # Retry webhook delivery
          max_retries=3
          retry_count=0
          success=false
          
          while [ "$success" = "false" ] && [ $retry_count -lt $max_retries ]; do
            if curl -sf -X POST "${{ github.event.inputs.callback_url }}" \
              -H "Content-Type: application/json" \
              -H "X-Signature: $signature" \
              --connect-timeout 10 \
              -d "$payload"; then
              success=true
              echo "Webhook delivered successfully"
            else
              retry_count=$((retry_count + 1))
              echo "Webhook failed (attempt $retry_count/$max_retries)"
              sleep 2
            fi
          done
