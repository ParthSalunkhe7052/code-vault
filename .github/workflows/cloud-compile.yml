name: Cloud Compile

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build job ID'
        required: true
        type: string
      project_id:
        description: 'Project ID'
        required: true
        type: string
      language:
        description: 'Language (python or nodejs)'
        required: true
        type: string
      source_url:
        description: 'R2 presigned URL for source download'
        required: true
        type: string
      config_json:
        description: 'Build configuration JSON'
        required: true
        type: string
      callback_url:
        description: 'Webhook URL for completion'
        required: true
        type: string
      callback_secret:
        description: 'HMAC secret for webhook'
        required: true
        type: string

jobs:
  compile-python:
    if: ${{ github.event.inputs.language == 'python' }}
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Nuitka and dependencies
        run: |
          pip install nuitka ordered-set zstandard
          pip install requests cryptography
      
      - name: Download source code
        shell: pwsh
        run: |
          curl -o source.zip "${{ github.event.inputs.source_url }}"
          Expand-Archive -Path source.zip -DestinationPath ./project
      
      - name: Create license wrapper script
        shell: pwsh
        run: |
          $wrapper = @'
          # === CodeVault License Validation ===
          import hashlib, json, os, platform, subprocess, sys, urllib.request
          _CV_LICENSE_KEY = "__LICENSE_KEY__"
          _CV_API_URL = "__API_URL__"
          def _cv_get_hwid():
              try:
                  cpu = platform.processor()
                  if platform.system() == "Windows":
                      serial = subprocess.check_output(["wmic", "bios", "get", "serialnumber"], text=True).strip().split()[-1]
                  else:
                      serial = "unknown"
                  import uuid
                  mac = ':'.join(f'{(uuid.getnode() >> i) & 0xff:02x}' for i in range(40, -1, -8))
                  return hashlib.sha256(f"{cpu}|{serial}|{mac}".encode()).hexdigest()
              except: return "error"
          def _cv_validate():
              if _CV_LICENSE_KEY == "GENERIC_BUILD" or not _CV_LICENSE_KEY:
                  return True
              try:
                  data = json.dumps({"license_key": _CV_LICENSE_KEY, "hwid": _cv_get_hwid()}).encode()
                  req = urllib.request.Request(_CV_API_URL, data=data, headers={"Content-Type": "application/json"})
                  resp = urllib.request.urlopen(req, timeout=10)
                  return json.loads(resp.read()).get("valid", False)
              except: return True
          if not _cv_validate():
              print("License validation failed")
              sys.exit(1)
          # === End CodeVault ===
          '@
          Set-Content -Path "./wrapper_template.py" -Value $wrapper
      
      - name: Inject wrapper and compile
        id: compile
        shell: pwsh
        env:
          CONFIG_JSON: ${{ github.event.inputs.config_json }}
        run: |
          $config = $env:CONFIG_JSON | ConvertFrom-Json
          
          $entryFile = Join-Path "./project" $config.entry_file
          if (-not (Test-Path $entryFile)) {
            $entryFile = Join-Path "./project/source" $config.entry_file
          }
          
          if (-not (Test-Path $entryFile)) {
            Write-Error "Entry file not found: $($config.entry_file)"
            exit 1
          }
          
          $licenseKey = if ($config.license_key) { $config.license_key } else { "GENERIC_BUILD" }
          $apiUrl = if ($config.api_url) { $config.api_url } else { "" }
          
          $wrapper = Get-Content "./wrapper_template.py" -Raw
          $wrapper = $wrapper.Replace("__LICENSE_KEY__", $licenseKey)
          $wrapper = $wrapper.Replace("__API_URL__", $apiUrl)
          
          $originalCode = Get-Content $entryFile -Raw
          $newCode = $wrapper + "`n" + $originalCode
          Set-Content -Path $entryFile -Value $newCode -Encoding UTF8
          
          $sourceDir = Split-Path -Parent $entryFile
          $entryFileName = Split-Path -Leaf $entryFile
          $outputName = if ($config.output_name) { $config.output_name } else { "app" }
          
          Push-Location $sourceDir
          python -m nuitka --standalone --onefile --assume-yes-for-downloads --windows-disable-console=false --output-filename="$outputName.exe" $entryFileName
          Pop-Location
          
          $exe = Get-ChildItem -Path $sourceDir -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            echo "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_ENV
            echo "EXE_NAME=$($exe.Name)" >> $env:GITHUB_ENV
          } else {
            Write-Error "No executable produced"
            exit 1
          }
      
      - name: Install AWS CLI
        shell: pwsh
        run: choco install awscli -y
      
      - name: Upload to R2
        shell: pwsh
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws configure set aws_access_key_id $env:R2_ACCESS_KEY
          aws configure set aws_secret_access_key $env:R2_SECRET_KEY
          aws configure set default.region auto
          
          $key = "builds/${{ github.event.inputs.build_id }}/$env:EXE_NAME"
          aws s3 cp $env:EXE_PATH "s3://$env:R2_BUCKET/$key" --endpoint-url $env:R2_ENDPOINT
          
          echo "UPLOAD_KEY=$key" >> $env:GITHUB_ENV
          echo "UPLOAD_FILENAME=$env:EXE_NAME" >> $env:GITHUB_ENV
      
      - name: Notify completion
        if: always()
        shell: pwsh
        env:
          CALLBACK_SECRET: ${{ github.event.inputs.callback_secret }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          $status = if ($env:UPLOAD_KEY) { "completed" } else { "failed" }
          
          $bodyObj = @{
            build_id = $env:BUILD_ID
            status = $status
            download_key = $env:UPLOAD_KEY
            filename = $env:UPLOAD_FILENAME
          }
          if ($status -eq "failed") {
            $bodyObj.error = "Compilation failed"
          }
          $body = $bodyObj | ConvertTo-Json -Compress
          
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($env:CALLBACK_SECRET)
          $signature = [System.BitConverter]::ToString($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($body))).Replace("-", "").ToLower()
          
          try {
            Invoke-RestMethod -Uri $env:CALLBACK_URL -Method POST -ContentType "application/json" -Headers @{ "X-Signature" = $signature } -Body $body
            Write-Host "Webhook sent successfully"
          } catch {
            Write-Warning "Failed to send webhook: $_"
          }

  compile-nodejs:
    if: ${{ github.event.inputs.language == 'nodejs' }}
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install pkg
        run: npm install -g pkg
      
      - name: Download source code
        shell: pwsh
        run: |
          curl -o source.zip "${{ github.event.inputs.source_url }}"
          Expand-Archive -Path source.zip -DestinationPath ./project
      
      - name: Create license wrapper script
        shell: pwsh
        run: |
          $wrapper = @'
          // === CodeVault License Validation ===
          const os = require('os');
          const crypto = require('crypto');
          const https = require('https');
          const http = require('http');
          const CV_LICENSE_KEY = '__LICENSE_KEY__';
          const CV_API_URL = '__API_URL__';
          
          function getHWID() {
            const cpus = os.cpus()[0]?.model || 'unknown';
            const networkInterfaces = os.networkInterfaces();
            const mac = Object.values(networkInterfaces).flat().find(i => !i.internal && i.mac)?.mac || '00:00:00:00:00:00';
            return crypto.createHash('sha256').update(cpus + '|' + mac).digest('hex');
          }
          
          async function validateLicense() {
            if (!CV_LICENSE_KEY || CV_LICENSE_KEY === 'GENERIC_BUILD') {
              return true; // Skip validation for generic builds
            }
            
            const hwid = getHWID();
            const nonce = crypto.randomBytes(16).toString('hex');
            const timestamp = Math.floor(Date.now() / 1000);
            
            const payload = JSON.stringify({
              license_key: CV_LICENSE_KEY,
              hwid: hwid,
              nonce: nonce,
              timestamp: timestamp
            });
            
            return new Promise((resolve, reject) => {
              const url = new URL(CV_API_URL);
              const protocol = url.protocol === 'https:' ? https : http;
              
              const req = protocol.request({
                hostname: url.hostname,
                port: url.port || (url.protocol === 'https:' ? 443 : 80),
                path: url.pathname,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(payload)
                },
                timeout: 10000
              }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const response = JSON.parse(data);
                    if (res.statusCode === 200 && response.valid === true) {
                      console.log('[CodeVault] License validated successfully');
                      resolve(true);
                    } else {
                      console.error('[CodeVault] License validation failed:', response.message || 'Invalid license');
                      process.exit(1);
                    }
                  } catch (e) {
                    console.error('[CodeVault] License validation error:', e.message);
                    process.exit(1);
                  }
                });
              });
              
              req.on('error', (e) => {
                console.error('[CodeVault] License server unreachable:', e.message);
                process.exit(1);
              });
              
              req.on('timeout', () => {
                req.destroy();
                console.error('[CodeVault] License validation timed out');
                process.exit(1);
              });
              
              req.write(payload);
              req.end();
            });
          }
          
          // Validate license on startup
          if (CV_LICENSE_KEY && CV_LICENSE_KEY !== 'GENERIC_BUILD') {
            validateLicense().catch(() => process.exit(1));
          }
          // === End CodeVault ===
          '@
          Set-Content -Path "./wrapper_template.js" -Value $wrapper
      
      - name: Inject wrapper and compile
        id: compile
        shell: pwsh
        env:
          CONFIG_JSON: ${{ github.event.inputs.config_json }}
        run: |
          $config = $env:CONFIG_JSON | ConvertFrom-Json
          
          $entryFile = Join-Path "./project" $config.entry_file
          if (-not (Test-Path $entryFile)) {
            $entryFile = Join-Path "./project/source" $config.entry_file
          }
          
          if (-not (Test-Path $entryFile)) {
            Write-Error "Entry file not found: $($config.entry_file)"
            exit 1
          }
          
          $licenseKey = if ($config.license_key) { $config.license_key } else { "GENERIC_BUILD" }
          $apiUrl = if ($config.api_url) { $config.api_url } else { "" }
          
          $wrapper = Get-Content "./wrapper_template.js" -Raw
          $wrapper = $wrapper.Replace("__LICENSE_KEY__", $licenseKey)
          $wrapper = $wrapper.Replace("__API_URL__", $apiUrl)
          
          $originalCode = Get-Content $entryFile -Raw
          Set-Content -Path $entryFile -Value ($wrapper + "`n" + $originalCode) -Encoding UTF8
          
          $sourceDir = Split-Path -Parent $entryFile
          $entryFileName = Split-Path -Leaf $entryFile
          $outputName = if ($config.output_name) { $config.output_name } else { "app" }
          
          Push-Location $sourceDir
          if (Test-Path "package.json") { npm install --production }
          pkg $entryFileName --targets node18-win-x64 --output "$outputName.exe"
          Pop-Location
          
          $exe = Get-ChildItem -Path $sourceDir -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            echo "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_ENV
            echo "EXE_NAME=$($exe.Name)" >> $env:GITHUB_ENV
          } else {
            Write-Error "No executable produced"
            exit 1
          }
      
      - name: Install AWS CLI
        shell: pwsh
        run: choco install awscli -y
      
      - name: Upload to R2
        shell: pwsh
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws configure set aws_access_key_id $env:R2_ACCESS_KEY
          aws configure set aws_secret_access_key $env:R2_SECRET_KEY
          aws configure set default.region auto
          
          $key = "builds/${{ github.event.inputs.build_id }}/$env:EXE_NAME"
          aws s3 cp $env:EXE_PATH "s3://$env:R2_BUCKET/$key" --endpoint-url $env:R2_ENDPOINT
          
          echo "UPLOAD_KEY=$key" >> $env:GITHUB_ENV
          echo "UPLOAD_FILENAME=$env:EXE_NAME" >> $env:GITHUB_ENV
      
      - name: Notify completion
        if: always()
        shell: pwsh
        env:
          CALLBACK_SECRET: ${{ github.event.inputs.callback_secret }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          $status = if ($env:UPLOAD_KEY) { "completed" } else { "failed" }
          
          $bodyObj = @{
            build_id = $env:BUILD_ID
            status = $status
            download_key = $env:UPLOAD_KEY
            filename = $env:UPLOAD_FILENAME
          }
          if ($status -eq "failed") {
            $bodyObj.error = "Compilation failed"
          }
          $body = $bodyObj | ConvertTo-Json -Compress
          
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($env:CALLBACK_SECRET)
          $signature = [System.BitConverter]::ToString($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($body))).Replace("-", "").ToLower()
          
          try {
            Invoke-RestMethod -Uri $env:CALLBACK_URL -Method POST -ContentType "application/json" -Headers @{ "X-Signature" = $signature } -Body $body
            Write-Host "Webhook sent successfully"
          } catch {
            Write-Warning "Failed to send webhook: $_"
          }
