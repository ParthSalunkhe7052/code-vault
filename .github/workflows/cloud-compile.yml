name: Cloud Compile
run-name: Cloud Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build job ID'
        required: true
        type: string
      project_id:
        description: 'Project ID'
        required: true
        type: string
      language:
        description: 'Language (python or nodejs)'
        required: true
        type: string
      source_url:
        description: 'R2 presigned URL for source download'
        required: true
        type: string
      config_json:
        description: 'Build configuration JSON'
        required: true
        type: string
      callback_url:
        description: 'Webhook URL for completion'
        required: true
        type: string
      callback_secret:
        description: 'HMAC secret for webhook'
        required: true
        type: string

jobs:
  compile-python:
    if: ${{ github.event.inputs.language == 'python' }}
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/wrapper_python.py
          sparse-checkout-cone-mode: false
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Nuitka and dependencies
        run: |
          pip install nuitka ordered-set zstandard
          pip install requests cryptography
      
      - name: Download source code
        shell: pwsh
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
        run: |
          curl -o source.zip "$env:SOURCE_URL"
          Expand-Archive -Path source.zip -DestinationPath ./project
      
      - name: Inject wrapper and compile
        id: compile
        shell: pwsh
        env:
          CONFIG_JSON: ${{ github.event.inputs.config_json }}
        run: |
          $config = $env:CONFIG_JSON | ConvertFrom-Json
          
          $entryFile = Join-Path "./project" $config.entry_file
          if (-not (Test-Path $entryFile)) {
            $entryFile = Join-Path "./project/source" $config.entry_file
          }
          
          if (-not (Test-Path $entryFile)) {
            Write-Error "Entry file not found: $($config.entry_file)"
            exit 1
          }
          
          $licenseKey = if ($config.license_key) { $config.license_key } else { "GENERIC_BUILD" }
          $apiUrl = if ($config.api_url) { $config.api_url } else { "" }
          
          # Read the wrapper template from the checked out file
          $wrapperPath = "./.github/workflows/wrapper_python.py"
          if (-not (Test-Path $wrapperPath)) {
            Write-Error "Wrapper template not found at: $wrapperPath"
            exit 1
          }
          
          $wrapper = Get-Content $wrapperPath -Raw -Encoding UTF8
          $wrapper = $wrapper.Replace("__LICENSE_KEY__", $licenseKey)
          $wrapper = $wrapper.Replace("__API_URL__", $apiUrl)
          
          $originalCode = Get-Content $entryFile -Raw -Encoding UTF8
          $newCode = $wrapper + "`n" + $originalCode
          Set-Content -Path $entryFile -Value $newCode -Encoding UTF8
          
          $sourceDir = Split-Path -Parent $entryFile
          $entryFileName = Split-Path -Leaf $entryFile
          $outputName = if ($config.output_name) { $config.output_name } else { "app" }
          
          # Install project requirements if they exist
          $reqFile = Join-Path $sourceDir "requirements.txt"
          if (Test-Path $reqFile) {
            Write-Host "Installing project requirements..."
            pip install -r $reqFile
          }
          
          Push-Location $sourceDir
          # Include tkinter for GUI license dialog, use all CPU cores
          python -m nuitka --standalone --onefile --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --output-filename="$outputName.exe" `
            --jobs=4 `
            $entryFileName
          Pop-Location
          
          $exe = Get-ChildItem -Path $sourceDir -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            echo "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_ENV
            echo "EXE_NAME=$($exe.Name)" >> $env:GITHUB_ENV
          } else {
            Write-Error "No executable produced"
            exit 1
          }
      
      - name: Install AWS CLI
        shell: pwsh
        run: choco install awscli -y
      
      - name: Upload to R2
        shell: pwsh
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws configure set aws_access_key_id $env:R2_ACCESS_KEY
          aws configure set aws_secret_access_key $env:R2_SECRET_KEY
          aws configure set default.region auto
          
          $key = "builds/${{ github.event.inputs.build_id }}/$env:EXE_NAME"
          aws s3 cp $env:EXE_PATH "s3://$env:R2_BUCKET/$key" --endpoint-url $env:R2_ENDPOINT
          
          echo "UPLOAD_KEY=$key" >> $env:GITHUB_ENV
          echo "UPLOAD_FILENAME=$env:EXE_NAME" >> $env:GITHUB_ENV
      
      - name: Notify completion
        if: always()
        shell: pwsh
        env:
          CALLBACK_SECRET: ${{ github.event.inputs.callback_secret }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          $status = if ($env:UPLOAD_KEY) { "completed" } else { "failed" }
          
          $bodyObj = @{
            build_id = $env:BUILD_ID
            status = $status
            download_key = $env:UPLOAD_KEY
            filename = $env:UPLOAD_FILENAME
          }
          if ($status -eq "failed") {
            $bodyObj.error = "Compilation failed"
          }
          $body = $bodyObj | ConvertTo-Json -Compress
          
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($env:CALLBACK_SECRET)
          $signature = [System.BitConverter]::ToString($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($body))).Replace("-", "").ToLower()
          
          try {
            Invoke-RestMethod -Uri $env:CALLBACK_URL -Method POST -ContentType "application/json" -Headers @{ "X-Signature" = $signature } -Body $body
            Write-Host "Webhook sent successfully"
          } catch {
            Write-Warning "Failed to send webhook: $_"
          }

  compile-nodejs:
    if: ${{ github.event.inputs.language == 'nodejs' }}
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/wrapper_nodejs.js
          sparse-checkout-cone-mode: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install pkg
        run: npm install -g pkg
      
      - name: Download source code
        shell: pwsh
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
        run: |
          curl -o source.zip "$env:SOURCE_URL"
          Expand-Archive -Path source.zip -DestinationPath ./project
      
      - name: Inject wrapper and compile
        id: compile
        shell: pwsh
        env:
          CONFIG_JSON: ${{ github.event.inputs.config_json }}
        run: |
          $config = $env:CONFIG_JSON | ConvertFrom-Json
          
          $entryFile = Join-Path "./project" $config.entry_file
          if (-not (Test-Path $entryFile)) {
            $entryFile = Join-Path "./project/source" $config.entry_file
          }
          
          if (-not (Test-Path $entryFile)) {
            Write-Error "Entry file not found: $($config.entry_file)"
            exit 1
          }
          
          $licenseKey = if ($config.license_key) { $config.license_key } else { "GENERIC_BUILD" }
          $apiUrl = if ($config.api_url) { $config.api_url } else { "" }
          
          # Read the wrapper template from the checked out file
          $wrapperPath = "./.github/workflows/wrapper_nodejs.js"
          if (-not (Test-Path $wrapperPath)) {
            Write-Error "Wrapper template not found at: $wrapperPath"
            exit 1
          }
          
          $wrapper = Get-Content $wrapperPath -Raw -Encoding UTF8
          $wrapper = $wrapper.Replace("__LICENSE_KEY__", $licenseKey)
          $wrapper = $wrapper.Replace("__API_URL__", $apiUrl)
          
          # Rename original file to allow async bootstrap
          $entryDir = Split-Path -Parent $entryFile
          $entryName = Split-Path -Leaf $entryFile
          $renamedEntry = "__original_" + $entryName
          
          Rename-Item -Path $entryFile -NewName $renamedEntry
          
          $bootstrap = "(async () => { try { await licenseCheck(); } catch (e) { console.error(e); process.exit(1); } require('./$renamedEntry'); })();"
          
          Set-Content -Path $entryFile -Value ($wrapper + "`n" + $bootstrap) -Encoding UTF8
          
          $sourceDir = Split-Path -Parent $entryFile
          $entryFileName = Split-Path -Leaf $entryFile
          $outputName = if ($config.output_name) { $config.output_name } else { "app" }
          
          Push-Location $sourceDir
          if (Test-Path "package.json") { npm install --production }
          pkg $entryFileName --targets node18-win-x64 --output "$outputName.exe"
          Pop-Location
          
          $exe = Get-ChildItem -Path $sourceDir -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            echo "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_ENV
            echo "EXE_NAME=$($exe.Name)" >> $env:GITHUB_ENV
          } else {
            Write-Error "No executable produced"
            exit 1
          }
      
      - name: Install AWS CLI
        shell: pwsh
        run: choco install awscli -y
      
      - name: Upload to R2
        shell: pwsh
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          aws configure set aws_access_key_id $env:R2_ACCESS_KEY
          aws configure set aws_secret_access_key $env:R2_SECRET_KEY
          aws configure set default.region auto
          
          $key = "builds/${{ github.event.inputs.build_id }}/$env:EXE_NAME"
          aws s3 cp $env:EXE_PATH "s3://$env:R2_BUCKET/$key" --endpoint-url $env:R2_ENDPOINT
          
          echo "UPLOAD_KEY=$key" >> $env:GITHUB_ENV
          echo "UPLOAD_FILENAME=$env:EXE_NAME" >> $env:GITHUB_ENV
      
      - name: Notify completion
        if: always()
        shell: pwsh
        env:
          CALLBACK_SECRET: ${{ github.event.inputs.callback_secret }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          $status = if ($env:UPLOAD_KEY) { "completed" } else { "failed" }
          
          $bodyObj = @{
            build_id = $env:BUILD_ID
            status = $status
            download_key = $env:UPLOAD_KEY
            filename = $env:UPLOAD_FILENAME
          }
          if ($status -eq "failed") {
            $bodyObj.error = "Compilation failed"
          }
          $body = $bodyObj | ConvertTo-Json -Compress
          
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [System.Text.Encoding]::UTF8.GetBytes($env:CALLBACK_SECRET)
          $signature = [System.BitConverter]::ToString($hmac.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($body))).Replace("-", "").ToLower()
          
          try {
            Invoke-RestMethod -Uri $env:CALLBACK_URL -Method POST -ContentType "application/json" -Headers @{ "X-Signature" = $signature } -Body $body
            Write-Host "Webhook sent successfully"
          } catch {
            Write-Warning "Failed to send webhook: $_"
          }
