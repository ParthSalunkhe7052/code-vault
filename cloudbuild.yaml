# ============================================
# CodeVault - Google Cloud Build Configuration
# ============================================
# This replaces GitHub Actions for production builds
# Supports multi-platform builds: Windows, Linux, macOS

substitutions:
  # Build parameters (passed from API)
  _BUILD_ID: 'unknown'
  _PROJECT_ID: 'unknown'
  _LANGUAGE: 'python'
  _TARGET_PLATFORMS: 'windows,linux,macos'
  _SOURCE_URL: ''
  _CONFIG_URL: ''  # GCS URL to config JSON (avoids 8KB substitution limit)
  _CALLBACK_URL: ''
  _OUTPUT_NAME: 'app'
  _DEBUG_BUILD: 'false'  # Set to 'true' for verbose logging
  _NUITKA_CACHE_DIR: '/workspace/.nuitka-cache'

options:
  machineType: 'E2_HIGHCPU_8'  # 8 vCPUs for faster builds
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  pool: {}

timeout: 3600s  # 60 minutes max per build

# ============================================
# Build Steps
# ============================================
steps:
  # ===== STEP 1: Download Source =====
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'download-source'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Use all variables to satisfy API validation
        echo "Building: ${_BUILD_ID} for ${_PROJECT_ID} (${_LANGUAGE})"
        echo "Target: ${_TARGET_PLATFORMS}, Output: ${_OUTPUT_NAME}, Debug: ${_DEBUG_BUILD}"
        
        if [[ "${_SOURCE_URL}" == gs://* ]]; then
          gsutil cp "${_SOURCE_URL}" source.zip
        else
          curl -L -o source.zip "${_SOURCE_URL}"
        fi
    waitFor: ['-']

  # ===== STEP 2: Extract and Normalize Source =====
  - name: 'ubuntu'
    id: 'extract-source'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq unzip > /dev/null 2>&1
        
        echo "[Cloud Build] Extracting source..."
        unzip -q source.zip -d ./project || exit 1
        
        # Normalize directory structure
        if [ -d "./project/.github" ]; then
          echo "[Cloud Build] Structure looks correct"
          mkdir -p ./project/source
          find ./project -maxdepth 1 ! -name "source" ! -name "." -exec mv {} ./project/source/ \;
        elif [ -d "./project/source" ]; then
          echo "[Cloud Build] Source already in subfolder"
        else
          mkdir -p ./project/source
          mv ./project/* ./project/source/ 2>/dev/null || true
        fi
        
        echo "[Cloud Build] Source prepared successfully"
    waitFor: ['download-source']

  # ===== STEP 3: Download config once for all platforms =====
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'download-config'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "${_TARGET_PLATFORMS}" == "" ]]; then
          echo "[Cloud Build] No target platforms specified"
          exit 0
        fi
        echo "[Cloud Build] Downloading build config..."
        if gsutil cp "${_CONFIG_URL}" /workspace/config.json; then
          echo "[Cloud Build] Config ready for all platforms"
        else
          echo "[Cloud Build] ERROR: Config download failed"
          exit 1
        fi
    waitFor: ['extract-source']

  # ===== STEP 4: Build for Linux (Python) =====
  - name: 'python:3.11-slim'
    id: 'build-linux'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        
        # Check platform and language
        if [[ "${_TARGET_PLATFORMS}" != *"linux"* || "${_LANGUAGE}" != "python" ]]; then
          echo "[Cloud Build] Skipping Linux build (not Python or not in target)"
          exit 0
        fi
        
        echo "[Cloud Build] ===== Building for Linux ====="
        
        # Install build dependencies
        apt-get update -qq && apt-get install -y -qq patchelf build-essential ccache > /dev/null 2>&1
        
        # Install Python build tools
        pip install --quiet --disable-pip-version-check nuitka ordered-set zstandard requests cryptography
        
        # Load config
        decoded_config=$$(cat /workspace/config.json)
        
        # Run runner
        python3 "./project/source/.github/scripts/cloud_runner.py" \
          --config "$$decoded_config" \
          --source "./project/source"
        
        # Package output
        cd "./project/source"
        output_name="${_OUTPUT_NAME}"
        if [ -f "$$output_name" ]; then
          chmod +x "$$output_name"
          tar -czf "$$output_name-linux.tar.gz" "$$output_name"
          mkdir -p /workspace/artifacts
          mv "$$output_name-linux.tar.gz" /workspace/artifacts/
          echo "completed" > /workspace/build_status_linux
        fi
    waitFor: ['download-config']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  # ===== STEP 4b: Build for Windows (Python) =====
  - name: 'docker.io/tobix/pywine:3.11'
    id: 'build-windows'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        
        # Check platform and language
        if [[ "${_TARGET_PLATFORMS}" != *"windows"* || "${_LANGUAGE}" != "python" ]]; then
          echo "[Cloud Build] Skipping Windows build (not Python or not in target)"
          exit 0
        fi
        
        echo "[Cloud Build] ===== Building for Windows ====="
        
        # Rick Hack: Force Nuitka cache and dummy bypass
        export NUITKA_CACHE_DIR=${_NUITKA_CACHE_DIR}
        mkdir -p $$NUITKA_CACHE_DIR
        
        # Install deps in Wine
        wine python -m pip install --upgrade --quiet --disable-pip-version-check \
          nuitka ordered-set zstandard requests cryptography pefile
        
        # Rick Hack: Monkey-patch Nuitka using Base64-encoded Python script
        nuitka_depends_py=$$(find /opt/wineprefix -name "DependsExe.py" | grep "freezer" | head -1)
        
        if [ -n "$$nuitka_depends_py" ]; then
          echo "" | base64 -d > patcher.py
          wine python patcher.py "$$nuitka_depends_py"
          echo "[Cloud Build] Patch applied successfully"
        fi
        
        # Run runner
        decoded_config=$$(cat /workspace/config.json)
        wine python "./project/source/.github/scripts/cloud_runner.py" \
          --config "$$decoded_config" \
          --source "$$(winepath -w $$(realpath ./project/source))"
        
        # Package output
        output_name="${_OUTPUT_NAME}"
        if [ -f "./project/source/$$output_name.exe" ]; then
          zip -q "$$output_name-windows.zip" "./project/source/$$output_name.exe"
          mkdir -p /workspace/artifacts
          mv "$$output_name-windows.zip" /workspace/artifacts/
          echo "completed" > /workspace/build_status_windows
        fi
    waitFor: ['download-config']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  # ===== STEP 4c: Build for Node.js =====
  - name: 'node:18-slim'
    id: 'build-nodejs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        if [[ "${_LANGUAGE}" != "nodejs" ]]; then
          echo "[Cloud Build] Skipping Node.js build"
          exit 0
        fi
        
        echo "[Cloud Build] ===== Building for Node.js ====="
        npm install -g pkg --quiet
        cd "./project/source"
        if [ -f "package.json" ]; then npm install --quiet; fi
        
        mkdir -p /workspace/artifacts
        pkg . --target node18-linux-x64,node18-win-x64 --out-path /workspace/artifacts/
        
        echo "completed" > /workspace/build_status_linux
        echo "completed" > /workspace/build_status_windows
    waitFor: ['download-config']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  # ===== STEP 6: Send Webhook Callback =====
  - name: 'gcr.io/cloud-builders/curl'
    id: 'webhook-callback'
    entrypoint: 'bash'
    secretEnv: ['_CALLBACK_SECRET']
    args:
      - '-c'
      - |
        set +e
        linux_status=$$(cat /workspace/build_status_linux 2>/dev/null || echo "pending")
        windows_status=$$(cat /workspace/build_status_windows 2>/dev/null || echo "pending")
        
        # Overall HMAC
        payload='{"build_id":"'"${_BUILD_ID}"'","status":"completed","timestamp":'"$$(date +%s)"'}'
        sig=$$(echo -n "$$payload" | openssl dgst -sha256 -hmac "$$_CALLBACK_SECRET" | awk '{print $$2}')
        
        curl -sf -X POST "${_CALLBACK_URL}" \
          -H "Content-Type: application/json" \
          -H "X-Signature: $$sig" \
          -d "$$payload" || echo "Webhook failed"
    waitFor: ['build-linux', 'build-windows', 'build-nodejs']

# ===== Secrets Configuration =====
availableSecrets:
  secretManager:
    - versionName: projects/cloudbuild-486309/secrets/callback-webhook-secret/versions/latest
      env: '_CALLBACK_SECRET'