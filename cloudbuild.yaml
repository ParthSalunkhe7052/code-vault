# ============================================
# CodeVault - Google Cloud Build Configuration
# ============================================
# Optimized for fast builds with caching and parallel execution
# Supports multi-platform builds: Windows, Linux

substitutions:
  _CALLBACK_URL: 'https://api.codevault.parth7.me/api/v1/cloud-build/webhook'
  _CALLBACK_SECRET: ''
  _TARGET_PLATFORMS: 'linux,windows'
  _LANGUAGE: 'python'
  _GCS_BUCKET: 'codevault-builds'
  _SOURCE_URL: ''
  _CONFIG_URL: ''
  _OUTPUT_NAME: 'app'
  _BUILD_ID: 'unknown'

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  pool: {}

timeout: 3600s

steps:
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'restore-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set +e
        echo "[Cloud Build] Attempting to restore cache..."
        
        # Restore pip cache
        if gsutil -q stat "gs://${_GCS_BUCKET}/cache/pip-cache-default.tar.gz" 2>/dev/null; then
          echo "[Cloud Build] Restoring pip cache..."
          gsutil cp "gs://${_GCS_BUCKET}/cache/pip-cache-default.tar.gz" /tmp/pip-cache.tar.gz
          mkdir -p /root/.cache/pip
          tar -xzf /tmp/pip-cache.tar.gz -C /root/.cache/pip 2>/dev/null || true
          echo "[Cloud Build] pip cache restored"
        else
          echo "[Cloud Build] pip cache not found (first build or cache expired)"
        fi
        
        # Restore ccache
        if gsutil -q stat "gs://${_GCS_BUCKET}/cache/ccache-default.tar.gz" 2>/dev/null; then
          echo "[Cloud Build] Restoring ccache..."
          gsutil cp "gs://${_GCS_BUCKET}/cache/ccache-default.tar.gz" /tmp/ccache.tar.gz
          mkdir -p /workspace/.ccache
          tar -xzf /tmp/ccache.tar.gz -C /workspace/.ccache 2>/dev/null || true
          echo "[Cloud Build] ccache restored"
        else
          echo "[Cloud Build] ccache not found"
        fi
        
        # Restore Nuitka cache (skip if cache is too large - causes slow builds)
        if gsutil -q stat "gs://${_GCS_BUCKET}/cache/nuitka-cache-default.tar.gz" 2>/dev/null; then
          cache_size=$$(gsutil ls -l "gs://${_GCS_BUCKET}/cache/nuitka-cache-default.tar.gz" 2>/dev/null | awk '{print $$1}')
          # Skip if cache is larger than 100MB (causes slow downloads)
          if [ "$$cache_size" -gt 104857600 ]; then
            echo "[Cloud Build] Skipping Nuitka cache (too large: $$cache_size bytes)"
          else
            echo "[Cloud Build] Restoring Nuitka cache..."
            gsutil cp "gs://${_GCS_BUCKET}/cache/nuitka-cache-default.tar.gz" /tmp/nuitka-cache.tar.gz
            mkdir -p /workspace/.nuitka-cache
            tar -xzf /tmp/nuitka-cache.tar.gz -C /workspace/.nuitka-cache 2>/dev/null || true
            echo "[Cloud Build] Nuitka cache restored"
          fi
        else
          echo "[Cloud Build] Nuitka cache not found"
        fi
        
        echo "[Cloud Build] Cache restore complete"
    waitFor: ['-']

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'download-source'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Building: ${_BUILD_ID} for ${_PROJECT_ID} (${_LANGUAGE})"
        echo "Target: ${_TARGET_PLATFORMS}, Output: ${_OUTPUT_NAME}"
        if [[ "${_SOURCE_URL}" == gs://* ]]; then
          gsutil cp "${_SOURCE_URL}" source.zip
        else
          curl -L -o source.zip "${_SOURCE_URL}"
        fi
    waitFor: ['restore-cache']

  - name: 'ubuntu'
    id: 'extract-source'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq unzip > /dev/null 2>&1
        echo "[Cloud Build] Extracting source..."
        unzip -q source.zip -d ./extracted
        mkdir -p ./project/source
        if [ -d "./extracted/.github" ]; then
          cp -r ./extracted/. ./project/source/
        elif [ -d "./extracted/source" ]; then
          cp -r ./extracted/source/. ./project/source/
          if [ -d "./extracted/.github" ]; then cp -r ./extracted/.github ./project/source/ 2>/dev/null || true; fi
        else
          cp -r ./extracted/. ./project/source/ 2>/dev/null || true
        fi
        echo "[Cloud Build] Source prepared"
    waitFor: ['download-source']

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'download-config'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "${_TARGET_PLATFORMS}" == "" ]]; then
          exit 0
        fi
        echo "[Cloud Build] Downloading config..."
        gsutil cp "${_CONFIG_URL}" /workspace/config.json
    waitFor: ['extract-source']

  - name: 'gcr.io/cloudbuild-486309/codevault-builder:latest'
    id: 'build-linux'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        if [[ "${_TARGET_PLATFORMS}" != *"linux"* || "${_LANGUAGE}" != "python" ]]; then
          echo "[Cloud Build] Skipping Linux build"
          echo "skipped" > /workspace/build_status_linux
          exit 0
        fi

        echo "[Cloud Build] ===== Building for Linux (6 parallel jobs, standalone mode) ====="

        # Pre-installed in codevault-builder image: patchelf, build-essential, ccache, python3-tk, python3-dev
        # Install Nuitka with pinned version for consistency
        pip install --quiet --disable-pip-version-check nuitka==2.4.8 ordered-set zstandard requests cryptography

        if [ ! -f "./project/source/.github/scripts/cloud_runner.py" ]; then
          echo "cloud_runner.py not found" > ./project/source/error_message.txt
          echo "failed" > /workspace/build_status_linux
          exit 0
        fi

        decoded_config=$$(cat /workspace/config.json)
        export NUITKA_JOBS=6
        export NUITKA_CACHE_DIR=/workspace/.nuitka-cache
        mkdir -p $$NUITKA_CACHE_DIR
        
        # Restore Nuitka cache if exists
        if [ -d /workspace/.nuitka-cache ]; then
          echo "[Cloud Build] Restoring Nuitka cache..."
          mkdir -p $$HOME/.cache/Nuitka
          cp -r /workspace/.nuitka-cache/. $$HOME/.cache/Nuitka/ 2>/dev/null || true
        fi
        
        python3 "./project/source/.github/scripts/cloud_runner.py" --config "$$decoded_config" --source "./project/source" || true

        cd "./project/source"
        output_name="${_OUTPUT_NAME}"

        # Check for standalone output directory (build_output_linux)
        if [ -d "build_output_linux" ]; then
          found_binary=$$(find build_output_linux -type f -name "$$output_name" 2>/dev/null | head -1)
          if [ -n "$$found_binary" ]; then
            cp "$$found_binary" ./
          fi
        fi

        linux_artifacts=""
        linux_status="failed"
        linux_error=""

        if [ -f "$$output_name" ]; then
          chmod +x "$$output_name"
          # Package the standalone binary as tar.gz
          tar -czf "$$output_name.tar.gz" "$$output_name"
          mkdir -p /workspace/artifacts
          mv "$$output_name.tar.gz" /workspace/artifacts/
          linux_artifacts="$$output_name.tar.gz"
          linux_status="completed"
          echo "[Cloud Build] Linux artifact ready: $$linux_artifacts"
        else
          if [ -f "error_message.txt" ]; then
            linux_error=$$(cat error_message.txt)
          else
            linux_error="Linux build output '$$output_name' not found"
          fi
        fi

        echo "$$linux_status" > /workspace/build_status_linux
        echo "$$linux_artifacts" > /workspace/linux_artifacts
        echo "$$linux_error" > /workspace/linux_error
        
        # Save Nuitka cache (Nuitka uses ~/.cache/Nuitka on Linux)
        if [ -d "$$HOME/.cache/Nuitka" ]; then
          mkdir -p /workspace/.nuitka-cache
          cp -r $$HOME/.cache/Nuitka/. /workspace/.nuitka-cache/ 2>/dev/null || true
          nuitka_cache_size=$$(du -s /workspace/.nuitka-cache 2>/dev/null | cut -f1)
        elif [ -d "$$HOME/.cache/nuitka" ]; then
          mkdir -p /workspace/.nuitka-cache
          cp -r $$HOME/.cache/nuitka/. /workspace/.nuitka-cache/ 2>/dev/null || true
          nuitka_cache_size=$$(du -s /workspace/.nuitka-cache 2>/dev/null | cut -f1)
        else
          nuitka_cache_size=0
        fi
    waitFor: ['download-config']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'upload-linux'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        linux_status=$$(cat /workspace/build_status_linux 2>/dev/null || echo "pending")
        if [[ "$$linux_status" != "completed" ]]; then
          echo "[Cloud Build] Skipping Linux upload (status: $$linux_status)"
          exit 0
        fi
        linux_artifact=$$(cat /workspace/linux_artifacts 2>/dev/null)
        if [ -z "$$linux_artifact" ]; then
          exit 0
        fi
        
        # Retry logic for upload
        max_retries=3
        retry_count=0
        upload_success=false
        
        while [ $$retry_count -lt $$max_retries ] && [ "$$upload_success" = "false" ]; do
          if [ $$retry_count -gt 0 ]; then
            echo "[Cloud Build] Retrying upload (attempt $$((retry_count+1))/$$max_retries)..."
            sleep 2
          fi
          
          echo "[Cloud Build] Uploading Linux: $$linux_artifact"
          if gsutil cp "/workspace/artifacts/$$linux_artifact" "gs://${_GCS_BUCKET}/builds/${_BUILD_ID}/linux/$$linux_artifact" 2>/dev/null; then
            upload_success=true
            echo "[Cloud Build] Linux upload successful"
          else
            retry_count=$$((retry_count+1))
          fi
        done
        
        if [ "$$upload_success" != "true" ]; then
          echo "[Cloud Build] Linux upload failed after $$max_retries attempts"
          exit 1
        fi
    waitFor: ['build-linux']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  - name: 'docker.io/tobix/pywine:3.11'
    id: 'build-windows'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        if [[ "${_TARGET_PLATFORMS}" != *"windows"* || "${_LANGUAGE}" != "python" ]]; then
          echo "[Cloud Build] Skipping Windows build"
          echo "skipped" > /workspace/build_status_windows
          exit 0
        fi

        echo "[Cloud Build] ===== Building for Windows ====="

        export NUITKA_CACHE_DIR=/workspace/.nuitka-cache
        mkdir -p $$NUITKA_CACHE_DIR

        wine python -m pip install --upgrade --quiet --disable-pip-version-check nuitka ordered-set zstandard requests cryptography pefile

        if [ ! -f "./project/source/.github/scripts/cloud_runner.py" ]; then
          echo "cloud_runner.py not found" > ./project/source/error_message.txt
          echo "failed" > /workspace/build_status_windows
          exit 0
        fi

        nuitka_depends_py=$$(find /opt/wineprefix -name "DependsExe.py" | grep "freezer" | head -1)
        if [ -n "$$nuitka_depends_py" ]; then
          if [ -f "./project/source/.github/scripts/nuitka_patch.py" ]; then
            wine python "./project/source/.github/scripts/nuitka_patch.py" "$$nuitka_depends_py"
          fi
        fi

        decoded_config=$$(cat /workspace/config.json)
        wine python "./project/source/.github/scripts/cloud_runner.py" --config "$$decoded_config" --source "$$(winepath -w $$(realpath ./project/source))"

        output_name="${_OUTPUT_NAME}"
        echo "[Cloud Build] Looking for Windows build output..."

        # Find the main.dist folder (standalone mode creates this with exe + DLLs)
        dist_dir=""
        
        if [ -d "./project/source/build_output_windows_wine/main.dist" ]; then
          dist_dir="./project/source/build_output_windows_wine/main.dist"
          echo "[Cloud Build] Found standalone dist folder: $$dist_dir"
          # Count files in dist folder
          file_count=$$(ls -1 "$$dist_dir" 2>/dev/null | wc -l)
          echo "[Cloud Build] Dist folder contains $$file_count files (exe + DLLs)"
        else
          # Fallback: look for exe directly (shouldn't happen with --standalone)
          found_exe=$$(find ./project/source/build_output_windows_wine -type f -name "*.exe" 2>/dev/null | head -1)
          if [ -n "$$found_exe" ]; then
            echo "[Cloud Build] Found single exe: $$found_exe"
            mkdir -p ./project/source/build_output_windows_wine/main.dist
            cp "$$found_exe" ./project/source/build_output_windows_wine/main.dist/
            dist_dir="./project/source/build_output_windows_wine/main.dist"
          fi
        fi

        windows_artifacts=""
        windows_status="failed"
        windows_error=""

        if [ -n "$$dist_dir" ] && [ -d "$$dist_dir" ]; then
          echo "[Cloud Build] Packaging Windows build..."
          
          # List all files being packaged
          echo "[Cloud Build] Files to package:"
          ls -la "$$dist_dir"
          
          # Create zip with ALL contents from dist folder (exe + DLLs + subfolders)
          # Using zip command for reliability
          mkdir -p /workspace/artifacts
          cd "$$dist_dir"
          
          # Package using wine python (more reliable in Wine environment)
          wine python -c "import shutil; shutil.make_archive('/workspace/artifacts/${output_name}-windows', 'zip', '.')"
          
          cd /workspace
          
          # Verify zip was created
          if [ -f "/workspace/artifacts/${output_name}-windows.zip" ]; then
            zip_size=$$(ls -lh "/workspace/artifacts/${output_name}-windows.zip" | awk '{print $$5}')
            echo "[Cloud Build] Created zip: $${zip_size}"
            
            windows_artifacts="${output_name}-windows.zip"
            windows_status="completed"
            echo "[Cloud Build] Windows artifact ready: $$windows_artifacts (contains exe + all DLLs)"
          else
            windows_error="Failed to create zip package"
          fi
        else
          if [ -f "./project/source/error_message.txt" ]; then
            windows_error=$$(cat ./project/source/error_message.txt)
          else
            windows_error="Windows build output not found"
          fi
        fi

        echo "$$windows_status" > /workspace/build_status_windows
        echo "$$windows_artifacts" > /workspace/windows_artifacts
        echo "$$windows_error" > /workspace/windows_error
    waitFor: ['download-config']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'upload-windows'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        windows_status=$$(cat /workspace/build_status_windows 2>/dev/null || echo "pending")
        if [[ "$$windows_status" != "completed" ]]; then
          echo "[Cloud Build] Skipping Windows upload (status: $$windows_status)"
          exit 0
        fi
        windows_artifact=$$(cat /workspace/windows_artifacts 2>/dev/null)
        if [ -z "$$windows_artifact" ]; then
          exit 0
        fi
        echo "[Cloud Build] Uploading Windows: $$windows_artifact"
        gsutil cp "/workspace/artifacts/$$windows_artifact" "gs://${_GCS_BUCKET}/builds/${_BUILD_ID}/windows/$$windows_artifact"
    waitFor: ['build-windows']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  - name: 'node:20-slim'
    id: 'build-nodejs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        if [[ "${_LANGUAGE}" != "nodejs" ]]; then
          echo "[Cloud Build] Skipping Node.js build (not nodejs project)"
          exit 0
        fi
        echo "[Cloud Build] ===== Building for Node.js ====="
        npm install -g @yao-pkg/pkg --quiet
        cd "./project/source"
        if [ -f "package.json" ]; then npm install --quiet; fi
        mkdir -p /workspace/artifacts
        pkg . --target node20-linux-x64,node20-win-x64 --out-path /workspace/artifacts/
        echo "completed" > /workspace/build_status_linux
        echo "completed" > /workspace/build_status_windows
        output_name="${_OUTPUT_NAME}"
        echo "$$output_name-linux" > /workspace/linux_artifacts
        echo "$$output_name-win.exe" > /workspace/windows_artifacts
    waitFor: ['download-config']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'save-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set +e
        echo "[Cloud Build] Saving cache..."
        
        # Save pip cache
        if [ -d /root/.cache/pip ]; then
          pip_cache_size=$$(du -s /root/.cache/pip 2>/dev/null | cut -f1)
          if [ "$$pip_cache_size" -gt 1000 ]; then
            tar -czf /tmp/pip-cache.tar.gz -C /root/.cache/pip . 2>/dev/null
            gsutil cp /tmp/pip-cache.tar.gz "gs://${_GCS_BUCKET}/cache/pip-cache-default.tar.gz"
            echo "[Cloud Build] Saved pip cache ($$pip_cache_size KB)"
          else
            echo "[Cloud Build] pip cache empty ($$pip_cache_size KB), skipping"
          fi
        else
          echo "[Cloud Build] pip cache not found, skipping"
        fi
        
        # Save ccache
        if [ -d /workspace/.ccache ]; then
          ccache_size=$$(du -s /workspace/.ccache 2>/dev/null | cut -f1)
          if [ "$$ccache_size" -gt 1000 ]; then
            tar -czf /tmp/ccache.tar.gz -C /workspace/.ccache . 2>/dev/null
            gsutil cp /tmp/ccache.tar.gz "gs://${_GCS_BUCKET}/cache/ccache-default.tar.gz"
            echo "[Cloud Build] Saved ccache ($$ccache_size KB)"
          else
            echo "[Cloud Build] ccache empty ($$ccache_size KB), skipping"
          fi
        else
          echo "[Cloud Build] ccache not found, skipping"
        fi
        
        # Save Nuitka cache - DISABLED (causes slow builds when cache grows too large)
        # The first build of each project is slightly slower, but subsequent builds are fast
        # due to Nuitka's own internal caching in the build directory
        echo "[Cloud Build] Skipping Nuitka cache save (disabled to prevent slow builds)"
        
        echo "[Cloud Build] Cache save complete"
    waitFor: ['upload-linux', 'upload-windows', 'build-nodejs']

  - name: 'gcr.io/cloud-builders/curl'
    id: 'webhook-callback'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set +e
        echo "============================================"
        echo "[Cloud Build] Preparing webhook callback..."
        echo "============================================"

        linux_status=$$(cat /workspace/build_status_linux 2>/dev/null || echo "pending")
        windows_status=$$(cat /workspace/build_status_windows 2>/dev/null || echo "pending")
        linux_artifact=$$(cat /workspace/linux_artifacts 2>/dev/null || echo "")
        windows_artifact=$$(cat /workspace/windows_artifacts 2>/dev/null || echo "")
        linux_error=$$(cat /workspace/linux_error 2>/dev/null || echo "")
        windows_error=$$(cat /workspace/windows_error 2>/dev/null || echo "")

        echo "[Cloud Build] Linux: $$linux_status, artifact: $$linux_artifact"
        echo "[Cloud Build] Windows: $$windows_status, artifact: $$windows_artifact"

        all_skipped=true
        if [[ "$$linux_status" != "skipped" ]]; then all_skipped=false; fi
        if [[ "$$windows_status" != "skipped" ]]; then all_skipped=false; fi

        if [[ "$$all_skipped" == "true" ]]; then
          overall_status="cancelled"
        elif [[ "$$linux_status" == "completed" || "$$windows_status" == "completed" ]]; then
          overall_status="completed"
        else
          overall_status="failed"
        fi

        echo "[Cloud Build] Overall: $$overall_status"

        linux_download_key=""
        windows_download_key=""
        filename=""

        if [[ "$$linux_status" == "completed" && -n "$$linux_artifact" ]]; then
          linux_download_key="builds/${_BUILD_ID}/linux/$$linux_artifact"
          filename="$$linux_artifact"
        fi

        if [[ "$$windows_status" == "completed" && -n "$$windows_artifact" ]]; then
          windows_download_key="builds/${_BUILD_ID}/windows/$$windows_artifact"
          if [[ -z "$$filename" ]]; then
            filename="$$windows_artifact"
          fi
        fi

        error_msg=""
        if [[ "$$overall_status" == "failed" ]]; then
          if [[ -n "$$linux_error" ]]; then error_msg="Linux: $$linux_error; "; fi
          if [[ -n "$$windows_error" ]]; then error_msg="$${error_msg}Windows: $$windows_error"; fi
          if [[ -z "$$error_msg" ]]; then error_msg="Build failed"; fi
        fi

        error_msg_escaped=$$(echo "$$error_msg" | sed 's/"/\\"/g' | tr '\n' ' ')

        # $BUILD_ID is the actual GCP Cloud Build ID (built-in variable)
        # ${_BUILD_ID} is our CodeVault build ID (passed as substitution)
        payload="{\"build_id\":\"${_BUILD_ID}\",\"cloud_build_id\":\"$BUILD_ID\",\"status\":\"$$overall_status\",\"linux_status\":\"$$linux_status\",\"windows_status\":\"$$windows_status\",\"linux_download_key\":\"$$linux_download_key\",\"windows_download_key\":\"$$windows_download_key\",\"filename\":\"$$filename\",\"error\":\"$$error_msg_escaped\",\"timestamp\":$$(date +%s)}"

        if [ -n "${_CALLBACK_SECRET}" ]; then
          sig=$$(echo -n "$$payload" | openssl dgst -sha256 -hmac "${_CALLBACK_SECRET}" | awk '{print $$2}')
        else
          sig=""
        fi

        echo "[Cloud Build] Sending webhook to: ${_CALLBACK_URL}"
        echo "[Cloud Build] Payload: $$payload"

        max_retries=2
        retry_delay=2
        for i in $$(seq 1 $$max_retries); do
          echo "[Cloud Build] Attempt $$i/$$max_retries..."

          if [ -n "$$sig" ]; then
            response=$$(curl -s -w "\n%{http_code}" -X POST "${_CALLBACK_URL}" \
              -H "Content-Type: application/json" \
              -H "X-Signature: $$sig" \
              -d "$$payload" --connect-timeout 5 --max-time 10 2>&1)
          else
            response=$$(curl -s -w "\n%{http_code}" -X POST "${_CALLBACK_URL}" \
              -H "Content-Type: application/json" \
              -d "$$payload" --connect-timeout 5 --max-time 10 2>&1)
          fi

          http_code=$$(echo "$$response" | tail -1)

          echo "[Cloud Build] Response: HTTP $$http_code"

          if [[ "$$http_code" == "200" || "$$http_code" == "201" ]]; then
            echo "[Cloud Build] Success (HTTP $$http_code)"
            break
          else
            echo "[Cloud Build] Failed (HTTP $$http_code)"
            if [[ $$i -lt $$max_retries ]]; then
              echo "[Cloud Build] Retrying in $${retry_delay}s..."
              sleep $$retry_delay
              retry_delay=$$((retry_delay + 2))
            fi
          fi
        done

        echo "[Cloud Build] Webhook completed"
    waitFor: ['save-cache']