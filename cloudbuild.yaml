# ============================================
# CodeVault - Google Cloud Build Configuration
# ============================================
# Optimized for fast builds with caching and parallel execution
# Supports multi-platform builds: Windows, Linux

substitutions:
  _CALLBACK_URL: 'https://code-vault-b66848f67c75.herokuapp.com/api/v1/cloud-build/webhook'
  _TARGET_PLATFORMS: 'linux,windows'
  _LANGUAGE: 'python'
  _GCS_BUCKET: 'codevault-builds'
  _SOURCE_URL: ''
  _CONFIG_URL: ''
  _OUTPUT_NAME: 'app'
  _BUILD_ID: 'unknown'
  _PROJECT_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  pool: {}

timeout: 1800s

steps:
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'restore-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set +e
        echo "[Cloud Build] Attempting to restore cache..."
        
        # Restore pip cache
        if gsutil -q stat "gs://${_GCS_BUCKET}/cache/pip-cache-default.tar.gz" 2>/dev/null; then
          echo "[Cloud Build] Restoring pip cache..."
          gsutil cp "gs://${_GCS_BUCKET}/cache/pip-cache-default.tar.gz" /tmp/pip-cache.tar.gz
          mkdir -p /root/.cache/pip
          tar -xzf /tmp/pip-cache.tar.gz -C /root/.cache/pip 2>/dev/null || true
          echo "[Cloud Build] pip cache restored"
        else
          echo "[Cloud Build] pip cache not found (first build or cache expired)"
        fi
        
        # Restore ccache
        if gsutil -q stat "gs://${_GCS_BUCKET}/cache/ccache-default.tar.gz" 2>/dev/null; then
          echo "[Cloud Build] Restoring ccache..."
          gsutil cp "gs://${_GCS_BUCKET}/cache/ccache-default.tar.gz" /tmp/ccache.tar.gz
          mkdir -p /workspace/.ccache
          tar -xzf /tmp/ccache.tar.gz -C /workspace/.ccache 2>/dev/null || true
          echo "[Cloud Build] ccache restored"
        else
          echo "[Cloud Build] ccache not found"
        fi
        
        # Restore Nuitka cache (skip if cache is too large - causes slow builds)
        if gsutil -q stat "gs://${_GCS_BUCKET}/cache/nuitka-cache-default.tar.gz" 2>/dev/null; then
          # Get just the size number
          cache_size=$$(gsutil du "gs://${_GCS_BUCKET}/cache/nuitka-cache-default.tar.gz" 2>/dev/null | awk '{print $$1}' | cut -d'.' -f1)
          # Skip if cache is larger than 100MB (causes slow downloads)
          if [ -n "$$cache_size" ] && [ "$$cache_size" -gt 104857600 ]; then
            echo "[Cloud Build] Skipping Nuitka cache (too large: $$cache_size bytes)"
          else
            echo "[Cloud Build] Restoring Nuitka cache..."
            gsutil cp "gs://${_GCS_BUCKET}/cache/nuitka-cache-default.tar.gz" /tmp/nuitka-cache.tar.gz
            mkdir -p /workspace/.nuitka-cache
            tar -xzf /tmp/nuitka-cache.tar.gz -C /workspace/.nuitka-cache 2>/dev/null || true
            echo "[Cloud Build] Nuitka cache restored"
          fi
        else
          echo "[Cloud Build] Nuitka cache not found"
        fi
        
        echo "[Cloud Build] Cache restore complete"
    waitFor: ['-']

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'download-source'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Building: ${_BUILD_ID} for ${_PROJECT_ID} (${_LANGUAGE})"
        echo "Target: ${_TARGET_PLATFORMS}, Output: ${_OUTPUT_NAME}"
        if [[ "${_SOURCE_URL}" == gs://* ]]; then
          gsutil cp "${_SOURCE_URL}" source.zip
        else
          curl -L -o source.zip "${_SOURCE_URL}"
        fi
    waitFor: ['restore-cache']

  - name: 'ubuntu'
    id: 'extract-source'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq unzip > /dev/null 2>&1
        echo "[Cloud Build] Extracting source..."
        unzip -q source.zip -d ./extracted
        mkdir -p ./project/source
        if [ -d "./extracted/.github" ]; then
          cp -r ./extracted/. ./project/source/
        elif [ -d "./extracted/source" ]; then
          cp -r ./extracted/source/. ./project/source/
          if [ -d "./extracted/.github" ]; then cp -r ./extracted/.github ./project/source/ 2>/dev/null || true; fi
        else
          cp -r ./extracted/. ./project/source/ 2>/dev/null || true
        fi
        echo "[Cloud Build] Source prepared"
    waitFor: ['download-source']

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'download-config'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "${_TARGET_PLATFORMS}" == "" ]]; then
          exit 0
        fi
        echo "[Cloud Build] Downloading config..."
        gsutil cp "${_CONFIG_URL}" /workspace/config.json
    waitFor: ['extract-source']

  - name: 'gcr.io/cloudbuild-486309/codevault-builder:latest'
    id: 'build-linux'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # Check language FIRST - skip entire Python build for non-Python projects
        if [[ "${_LANGUAGE}" != "python" ]]; then
          echo "[Cloud Build] Skipping Linux build (not a Python project)"
          # Don't write status file - let Node.js build handle it
          exit 0
        fi
        
        if [[ "${_TARGET_PLATFORMS}" != *"linux"* ]]; then
          echo "[Cloud Build] Skipping Linux build"
          echo "skipped" > /workspace/artifacts/build_status_linux
          exit 0
        fi

        echo "[Cloud Build] ===== Building for Linux (6 parallel jobs, standalone mode) ====="

        # Ensure artifacts directory exists
        mkdir -p /workspace/artifacts

        # Pre-installed in codevault-builder image: patchelf, build-essential, ccache, python3-tk, python3-dev
        # Install Nuitka with pinned version for consistency
        pip install --quiet --disable-pip-version-check nuitka==2.4.8 ordered-set zstandard requests cryptography

        if [ ! -f "./project/source/.github/scripts/cloud_runner.py" ]; then
          echo "cloud_runner.py not found in source package" > ./project/source/error_message.txt
          echo "failed" > /workspace/artifacts/build_status_linux
          echo "" > /workspace/artifacts/linux_artifacts
          echo "cloud_runner.py not found in source package" > /workspace/artifacts/linux_error
          echo "[Cloud Build] ERROR: cloud_runner.py not found!"
          exit 0
        fi

        decoded_config=$$(cat /workspace/config.json)
        export NUITKA_JOBS=6
        export NUITKA_CACHE_DIR=/workspace/.nuitka-cache
        mkdir -p $$NUITKA_CACHE_DIR
        
        # Restore Nuitka cache if exists
        if [ -d /workspace/.nuitka-cache ]; then
          echo "[Cloud Build] Restoring Nuitka cache..."
          mkdir -p $$HOME/.cache/Nuitka
          cp -r /workspace/.nuitka-cache/. $$HOME/.cache/Nuitka/ 2>/dev/null || true
        fi
        
        python3 "./project/source/.github/scripts/cloud_runner.py" --config "$$decoded_config" --source "./project/source" || true

        cd "./project/source"
        output_name="${_OUTPUT_NAME}"

        linux_artifacts=""
        linux_status="failed"
        linux_error=""

        if [ $runner_exit_code -eq 0 ]; then
          # Check for standalone output - look for ANY .dist folder (Nuitka names it after entry file, not output name)
          # e.g., main.py -> main.dist, not {output_name}.dist
          dist_dir=$$(find ./project/source/build_output_linux -type d -name "*.dist" 2>/dev/null | head -1)
          
          if [ -n "$$dist_dir" ] && [ -d "$$dist_dir" ]; then
            dist_name=$$(basename "$$dist_dir")
            echo "[Cloud Build] Found standalone .dist folder: $$dist_dir (name: $$dist_name)"
            # Zip the entire .dist folder with all dependencies (including python dlls)
            mkdir -p /workspace/artifacts
            parent_dir=$$(dirname "$$dist_dir")
            cd "$$parent_dir"
            tar -czf "/workspace/artifacts/${output_name}.tar.gz" "$$dist_name"
            cd /workspace
            
            if [ -f "/workspace/artifacts/${output_name}.tar.gz" ]; then
              linux_artifacts="${output_name}.tar.gz"
              linux_status="completed"
              echo "[Cloud Build] Linux artifact ready: $$linux_artifacts (standalone folder with dependencies)"
            else
              linux_error="Failed to create tar.gz from .dist folder"
            fi
          elif [ -d "build_output_linux" ]; then
            # Fallback: Check for onefile mode (single binary)
            found_binary=$$(find build_output_linux -type f -name "$$output_name" 2>/dev/null | head -1)
            if [ -n "$$found_binary" ]; then
              cp "$$found_binary" ./
            fi
            
            if [ -f "$$output_name" ]; then
              chmod +x "$$output_name"
              # Package the onefile binary as tar.gz
              tar -czf "$$output_name.tar.gz" "$$output_name"
              mkdir -p /workspace/artifacts
              mv "$$output_name.tar.gz" /workspace/artifacts/
              linux_artifacts="$$output_name.tar.gz"
              linux_status="completed"
              echo "[Cloud Build] Linux artifact ready: $$linux_artifacts (onefile binary)"
            else
              if [ -f "error_message.txt" ]; then
                linux_error=$$(cat error_message.txt)
              else
                linux_error="Linux build output '$$output_name' not found"
              fi
            fi
          else
            if [ -f "error_message.txt" ]; then
              linux_error=$$(cat error_message.txt)
            else
              linux_error="Linux build output directory not found"
            fi
          fi
        fi

        echo "$$linux_status" > /workspace/artifacts/build_status_linux
        echo "$$linux_artifacts" > /workspace/artifacts/linux_artifacts
        echo "$$linux_error" > /workspace/artifacts/linux_error
        
        # Save Nuitka cache (Nuitka uses ~/.cache/Nuitka on Linux)
        if [ -d "$$HOME/.cache/Nuitka" ]; then
          mkdir -p /workspace/.nuitka-cache
          cp -r $$HOME/.cache/Nuitka/. /workspace/.nuitka-cache/ 2>/dev/null || true
          nuitka_cache_size=$$(du -s /workspace/.nuitka-cache 2>/dev/null | cut -f1)
        elif [ -d "$$HOME/.cache/nuitka" ]; then
          mkdir -p /workspace/.nuitka-cache
          cp -r $$HOME/.cache/nuitka/. /workspace/.nuitka-cache/ 2>/dev/null || true
          nuitka_cache_size=$$(du -s /workspace/.nuitka-cache 2>/dev/null | cut -f1)
        else
          nuitka_cache_size=0
        fi
    waitFor: ['download-config']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'upload-linux'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        linux_status=$$(cat /workspace/artifacts/build_status_linux 2>/dev/null || echo "pending")
        if [[ "$${linux_status}" != "completed" ]]; then
          echo "[Cloud Build] Skipping Linux upload (status: $${linux_status})"
          exit 0
        fi
        linux_artifact=$$(cat /workspace/artifacts/linux_artifacts 2>/dev/null)
        if [ -z "$${linux_artifact}" ]; then
          exit 0
        fi
        
        # Retry logic for upload
        max_retries=3
        retry_count=0
        upload_success=false
        
        while [ $${retry_count} -lt $${max_retries} ] && [ "$${upload_success}" = "false" ]; do
          if [ $${retry_count} -gt 0 ]; then
            echo "[Cloud Build] Retrying upload (attempt $$(($${retry_count}+1))/$${max_retries})..."
            sleep 2
          fi
          
          echo "[Cloud Build] Uploading Linux: $${linux_artifact}"
          if gsutil cp "/workspace/artifacts/$${linux_artifact}" "gs://${_GCS_BUCKET}/builds/${_BUILD_ID}/linux/$${linux_artifact}" 2>/dev/null; then
            upload_success=true
            echo "[Cloud Build] Linux upload successful"
          else
            retry_count=$$(($${retry_count}+1))
          fi
        done
        
        if [ "$$upload_success" != "true" ]; then
          echo "[Cloud Build] Linux upload failed after $$max_retries attempts"
          exit 1
        fi
    waitFor: ['build-linux']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  - name: 'docker.io/tobix/pywine:3.11'
    id: 'build-windows'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # Check language FIRST - skip entire Python build for non-Python projects
        if [[ "${_LANGUAGE}" != "python" ]]; then
          echo "[Cloud Build] Skipping Windows build (not a Python project)"
          # Don't write status file - let Node.js build handle it
          exit 0
        fi
        
        if [[ "${_TARGET_PLATFORMS}" != *"windows"* ]]; then
          echo "[Cloud Build] Skipping Windows build"
          echo "skipped" > /workspace/artifacts/build_status_windows
          exit 0
        fi

        echo "[Cloud Build] ===== Building for Windows ====="

        # Ensure artifacts directory exists
        mkdir -p /workspace/artifacts

        # Write Python zip helper (zip CLI is not available in tobix/pywine image)
        printf '%s\n' \
          'import zipfile, os, sys' \
          'dist, out = sys.argv[1], sys.argv[2]' \
          'with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:' \
          '    for root, dirs, files in os.walk(dist):' \
          '        dirs[:] = [d for d in dirs if d != "__pycache__"]' \
          '        for f in files:' \
          '            if not f.endswith(".pyc"):' \
          '                fp = os.path.join(root, f)' \
          '                zf.write(fp, os.path.relpath(fp, os.path.dirname(dist)))' \
          'print("Zip created:", out)' \
          > /tmp/make_zip.py

        export NUITKA_CACHE_DIR=/workspace/.nuitka-cache
        mkdir -p $$NUITKA_CACHE_DIR

        wine python -m pip install --upgrade --quiet --disable-pip-version-check nuitka ordered-set zstandard requests cryptography pefile

        if [ ! -f "./project/source/.github/scripts/cloud_runner.py" ]; then
          echo "cloud_runner.py not found in source package" > ./project/source/error_message.txt
          echo "failed" > /workspace/artifacts/build_status_windows
          echo "" > /workspace/artifacts/windows_artifacts
          echo "cloud_runner.py not found in source package" > /workspace/artifacts/windows_error
          echo "[Cloud Build] ERROR: cloud_runner.py not found!"
          exit 0
        fi

        nuitka_depends_py=$$(find /opt/wineprefix -name "DependsExe.py" | grep "freezer" | head -1)
        if [ -n "$$nuitka_depends_py" ]; then
          if [ -f "./project/source/.github/scripts/nuitka_patch.py" ]; then
            wine python "./project/source/.github/scripts/nuitka_patch.py" "$$nuitka_depends_py"
          fi
        fi

        decoded_config=$$(cat /workspace/config.json)
        
        echo "[Cloud Build] Running cloud_runner.py for Windows build..."
        echo "[Cloud Build] Source directory: $$(realpath ./project/source)"
        
        # Run cloud_runner.py and capture exit code
        # Note: winepath -w converts Unix path to Windows path for Wine
        set +e  # Temporarily disable exit on error to capture the exit code
        wine python "./project/source/.github/scripts/cloud_runner.py" --config "$$decoded_config" --source "$$(winepath -w $$(realpath ./project/source))" 2>&1
        runner_exit_code=$?
        set -e  # Re-enable exit on error
        
        if [ $$runner_exit_code -ne 0 ]; then
          echo "[Cloud Build] ERROR: cloud_runner.py exited with code $$runner_exit_code"
          echo "Build runner failed with exit code $$runner_exit_code" > ./project/source/error_message.txt
        fi
        
        # Debug: Show build output directory contents
        echo "[Cloud Build] Build output directory contents:"
        ls -la ./project/source/build_output_windows_wine 2>/dev/null || echo "No build output directory found"

        output_name="${_OUTPUT_NAME}"
        echo "[Cloud Build] Looking for Windows build output..."

        windows_artifacts=""
        windows_status="failed"
        windows_error=""

        if [ $runner_exit_code -eq 0 ]; then
          # Check for standalone output - look for ANY .dist folder (Nuitka names it after entry file, not output name)
          # e.g., main.py -> main.dist, not {output_name}.dist
          dist_dir=$$(find ./project/source/build_output_windows_wine -type d -name "*.dist" 2>/dev/null | head -1)
          
          if [ -n "$$dist_dir" ] && [ -d "$$dist_dir" ]; then
            dist_name=$$(basename "$$dist_dir")
            echo "[Cloud Build] Found standalone .dist folder: $$dist_dir (name: $$dist_name)"
            # List contents for debugging
            echo "[Cloud Build] .dist folder contents:"
            ls -la "$$dist_dir/" 2>/dev/null || true
            
            # Zip the entire .dist folder with all dependencies (including python311.dll)
            mkdir -p /workspace/artifacts
            parent_dir=$$(dirname "$$dist_dir")
            cd "$$parent_dir"
            # Use Python's built-in zipfile module - zip CLI is not available in tobix/pywine image
            python3 /tmp/make_zip.py "$$dist_name" "/workspace/artifacts/${output_name}.zip"
            cd /workspace

            if [ -f "/workspace/artifacts/${output_name}.zip" ]; then
              archive_size=$$(ls -lh "/workspace/artifacts/${output_name}.zip" | awk '{print $$5}')
              echo "[Cloud Build] Archive size: $$archive_size"
              windows_artifacts="${output_name}.zip"
              windows_status="completed"
              echo "[Cloud Build] Windows artifact ready: $$windows_artifacts (standalone folder with dependencies)"
            else
              windows_error="Failed to create zip from .dist folder"
            fi
          else
            # Fallback: Check for onefile mode (single EXE)
            echo "[Cloud Build] No .dist folder found, checking for onefile EXE..."
            found_exe=""
            
            if [ -f "./project/source/build_output_windows_wine/${output_name}.exe" ]; then
              found_exe="./project/source/build_output_windows_wine/${output_name}.exe"
              echo "[Cloud Build] Found onefile EXE: $$found_exe"
            else
              # Search for any exe in the output directory
              found_exe=$$(find ./project/source/build_output_windows_wine -type f -name "*.exe" 2>/dev/null | head -1)
              if [ -n "$$found_exe" ]; then
                echo "[Cloud Build] Found EXE: $$found_exe"
              fi
            fi

            if [ -n "$$found_exe" ] && [ -f "$$found_exe" ]; then
              exe_size=$$(ls -lh "$$found_exe" | awk '{print $$5}')
              echo "[Cloud Build] EXE size: $$exe_size"
              
              # For onefile mode, just copy the single EXE
              mkdir -p /workspace/artifacts
              cp "$$found_exe" "/workspace/artifacts/${output_name}.exe"
              
              if [ -f "/workspace/artifacts/${output_name}.exe" ]; then
                windows_artifacts="${output_name}.exe"
                windows_status="completed"
                echo "[Cloud Build] Windows artifact ready: $$windows_artifacts (self-contained onefile EXE)"
              else
                windows_error="Failed to copy EXE to artifacts"
              fi
            else
              if [ -f "./project/source/error_message.txt" ]; then
                windows_error=$$(cat ./project/source/error_message.txt)
              else
                windows_error="Windows EXE not found in build output"
              fi
            fi
          fi
        fi

        echo "$$windows_status" > /workspace/artifacts/build_status_windows
        echo "$$windows_artifacts" > /workspace/artifacts/windows_artifacts
        echo "$$windows_error" > /workspace/artifacts/windows_error
    waitFor: ['download-config']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'upload-windows'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        windows_status=$$(cat /workspace/artifacts/build_status_windows 2>/dev/null || echo "pending")
        if [[ "$$windows_status" != "completed" ]]; then
          echo "[Cloud Build] Skipping Windows upload (status: $$windows_status)"
          exit 0
        fi
        windows_artifact=$$(cat /workspace/artifacts/windows_artifacts 2>/dev/null)
        if [ -z "$$windows_artifact" ]; then
          exit 0
        fi
        echo "[Cloud Build] Uploading Windows: $$windows_artifact"
        gsutil cp "/workspace/artifacts/$$windows_artifact" "gs://${_GCS_BUCKET}/builds/${_BUILD_ID}/windows/$$windows_artifact"
    waitFor: ['build-windows']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  - name: 'node:20-slim'
    id: 'build-nodejs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        if [[ "${_LANGUAGE}" != "nodejs" ]]; then
          echo "[Cloud Build] Skipping Node.js build (not nodejs project)"
          exit 0
        fi
        echo "[Cloud Build] ===== Building for Node.js ====="
        echo "[Cloud Build] Build ID: ${_BUILD_ID}"
        echo "[Cloud Build] Output name: ${_OUTPUT_NAME}"
        
        # Install Python for the runner script
        apt-get update -qq && apt-get install -y -qq python3 > /dev/null 2>&1
        
        # Install pkg globally
        npm install -g @yao-pkg/pkg --quiet
        
        cd "./project/source"
        
        # Debug: Show directory contents
        echo "[Cloud Build] Directory contents:"
        ls -la
        echo ""
        
        # Debug: Show config
        echo "[Cloud Build] Config:"
        cat /workspace/config.json
        echo ""
        
        # Run the Node.js build runner
        if [ -f ".github/scripts/cloud_runner_nodejs.py" ]; then
          echo "[Cloud Build] Running cloud_runner_nodejs.py..."
          python3 .github/scripts/cloud_runner_nodejs.py --config "$$(cat /workspace/config.json)" --source "$$(pwd)" 2>&1 || {
            exit_code=$$?
            echo "[Cloud Build] Runner failed with exit code: $$exit_code"
            exit $$exit_code
          }
        else
          echo "[Cloud Build] ERROR: cloud_runner_nodejs.py not found!"
          exit 1
        fi
        
        # Copy artifacts to workspace
        mkdir -p /workspace/artifacts
        
        # Debug: Show artifacts directory
        echo "[Cloud Build] Artifacts directory contents:"
        ls -la /workspace/artifacts/ 2>/dev/null || echo "Artifacts directory empty or not found"
        
        # Parse target platforms from config
        target_platforms=$$(cat /workspace/config.json | python3 -c "import sys,json; print(','.join(json.load(sys.stdin).get('target_platforms', ['windows'])))" 2>/dev/null || echo "windows")
        echo "[Cloud Build] Target platforms: $$target_platforms"
        
        # Find and copy Windows artifact
        echo "[Cloud Build] DEBUG: Checking for Windows artifact..."
        if [[ "$$target_platforms" == *"windows"* ]]; then
          echo "[Cloud Build] DEBUG: Windows is in target platforms"
          if [ -f "build_output_windows/${_OUTPUT_NAME}.exe" ]; then
            cp "build_output_windows/${_OUTPUT_NAME}.exe" /workspace/artifacts/
            echo "completed" > /workspace/artifacts/build_status_windows
            echo "${_OUTPUT_NAME}.exe" > /workspace/artifacts/windows_artifacts
            echo "[Cloud Build] Found Windows artifact in build_output_windows"
            echo "[Cloud Build] DEBUG: Wrote windows_status=completed"
          elif [ -f "/workspace/artifacts/${_OUTPUT_NAME}.exe" ]; then
            echo "completed" > /workspace/artifacts/build_status_windows
            echo "${_OUTPUT_NAME}.exe" > /workspace/artifacts/windows_artifacts
            echo "[Cloud Build] Found Windows artifact in /workspace/artifacts"
            echo "[Cloud Build] DEBUG: Wrote windows_status=completed"
          else
            echo "failed" > /workspace/artifacts/build_status_windows
            echo "Node.js Windows build output not found" > /workspace/artifacts/windows_error
            echo "[Cloud Build] ERROR: Expected Windows exe file (${_OUTPUT_NAME}.exe) not found!"
            echo "[Cloud Build] DEBUG: Wrote windows_status=failed"
          fi
        else
          echo "skipped" > /workspace/artifacts/build_status_windows
          echo "[Cloud Build] Windows build skipped (not in target platforms)"
          echo "[Cloud Build] DEBUG: Wrote windows_status=skipped"
        fi
        
        # Find and copy Linux artifact
        if [[ "$$target_platforms" == *"linux"* ]]; then
          if [ -f "build_output_linux/${_OUTPUT_NAME}" ]; then
            cp "build_output_linux/${_OUTPUT_NAME}" /workspace/artifacts/
            chmod +x "/workspace/artifacts/${_OUTPUT_NAME}"
            echo "completed" > /workspace/artifacts/build_status_linux
            echo "${_OUTPUT_NAME}" > /workspace/artifacts/linux_artifacts
            echo "[Cloud Build] Found Linux artifact in build_output_linux"
          else
            echo "failed" > /workspace/artifacts/build_status_linux
            echo "Node.js Linux build output not found" > /workspace/artifacts/linux_error
            echo "[Cloud Build] ERROR: Expected Linux binary (${_OUTPUT_NAME}) not found!"
          fi
        else
          echo "skipped" > /workspace/artifacts/build_status_linux
          echo "[Cloud Build] Linux build skipped (not in target platforms)"
        fi
        
        echo "[Cloud Build] Node.js build step complete"
    waitFor: ['download-config']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'upload-nodejs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Only run if this is a Node.js build
        if [[ "${_LANGUAGE}" != "nodejs" ]]; then
          exit 0
        fi
        windows_status=$$(cat /workspace/artifacts/build_status_windows 2>/dev/null || echo "pending")
        if [[ "$$windows_status" != "completed" ]]; then
          echo "[Cloud Build] Skipping Node.js Windows upload (status: $$windows_status)"
          exit 0
        fi
        windows_artifact=$$(cat /workspace/artifacts/windows_artifacts 2>/dev/null)
        if [ -z "$$windows_artifact" ]; then
          exit 0
        fi
        echo "[Cloud Build] Uploading Node.js Windows artifact: $$windows_artifact"
        gsutil cp "/workspace/artifacts/$$windows_artifact" "gs://${_GCS_BUCKET}/builds/${_BUILD_ID}/windows/$$windows_artifact"
    waitFor: ['build-nodejs']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'upload-nodejs-linux'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Only run if this is a Node.js build
        if [[ "${_LANGUAGE}" != "nodejs" ]]; then
          exit 0
        fi
        linux_status=$$(cat /workspace/artifacts/build_status_linux 2>/dev/null || echo "pending")
        if [[ "$$linux_status" != "completed" ]]; then
          echo "[Cloud Build] Skipping Node.js Linux upload (status: $$linux_status)"
          exit 0
        fi
        linux_artifact=$$(cat /workspace/artifacts/linux_artifacts 2>/dev/null)
        if [ -z "$$linux_artifact" ]; then
          exit 0
        fi
        echo "[Cloud Build] Uploading Node.js Linux artifact: $$linux_artifact"
        gsutil cp "/workspace/artifacts/$$linux_artifact" "gs://${_GCS_BUCKET}/builds/${_BUILD_ID}/linux/$$linux_artifact"
    waitFor: ['build-nodejs']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'save-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set +e
        echo "[Cloud Build] Saving cache..."
        
        # Save pip cache
        if [ -d /root/.cache/pip ]; then
          pip_cache_size=$$(du -s /root/.cache/pip 2>/dev/null | cut -f1)
          if [ "$$pip_cache_size" -gt 1000 ]; then
            tar -czf /tmp/pip-cache.tar.gz -C /root/.cache/pip . 2>/dev/null
            gsutil cp /tmp/pip-cache.tar.gz "gs://${_GCS_BUCKET}/cache/pip-cache-default.tar.gz"
            echo "[Cloud Build] Saved pip cache ($$pip_cache_size KB)"
          else
            echo "[Cloud Build] pip cache empty ($$pip_cache_size KB), skipping"
          fi
        else
          echo "[Cloud Build] pip cache not found, skipping"
        fi
        
        # Save ccache
        if [ -d /workspace/.ccache ]; then
          ccache_size=$$(du -s /workspace/.ccache 2>/dev/null | cut -f1)
          if [ "$$ccache_size" -gt 1000 ]; then
            tar -czf /tmp/ccache.tar.gz -C /workspace/.ccache . 2>/dev/null
            gsutil cp /tmp/ccache.tar.gz "gs://${_GCS_BUCKET}/cache/ccache-default.tar.gz"
            echo "[Cloud Build] Saved ccache ($$ccache_size KB)"
          else
            echo "[Cloud Build] ccache empty ($$ccache_size KB), skipping"
          fi
        else
          echo "[Cloud Build] ccache not found, skipping"
        fi
        
        # Save Nuitka cache - DISABLED (causes slow builds when cache grows too large)
        # The first build of each project is slightly slower, but subsequent builds are fast
        # due to Nuitka's own internal caching in the build directory
        echo "[Cloud Build] Skipping Nuitka cache save (disabled to prevent slow builds)"
        
        echo "[Cloud Build] Cache save complete"
    waitFor: ['upload-linux', 'upload-windows', 'upload-nodejs', 'upload-nodejs-linux']

  - name: 'gcr.io/cloud-builders/curl'
    id: 'webhook-callback'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set +e
        echo "============================================"
        echo "[Cloud Build] Preparing webhook callback..."
        echo "============================================"
        
        # Debug: show artifacts directory contents
        echo "[Cloud Build] DEBUG: Artifacts directory contents:"
        ls -la /workspace/artifacts/ 2>/dev/null || echo "Artifacts dir not found"
        
        # Config was already downloaded to /workspace/config.json in Step #3 from R2
        # No need to download from GCS - just check if it exists locally
        if [ -f /workspace/config.json ]; then
          echo "[Cloud Build] Config found locally (downloaded from R2 in Step #3)"
        else
          echo "[Cloud Build] Config not found locally"
        fi

        # Read status files - check both Python and Node.js build outputs
        linux_status=$$(cat /workspace/artifacts/build_status_linux 2>/dev/null || echo "pending")
        windows_status=$$(cat /workspace/artifacts/build_status_windows 2>/dev/null || echo "pending")
        windows_artifact=$$(cat /workspace/artifacts/windows_artifacts 2>/dev/null || echo "")
        linux_artifact=$$(cat /workspace/artifacts/linux_artifacts 2>/dev/null || echo "")
        
        # Debug: show what was read
        echo "[Cloud Build] DEBUG: linux_status=$$linux_status, windows_status=$$windows_status"
        echo "[Cloud Build] DEBUG: windows_artifact=$$windows_artifact, linux_artifact=$$linux_artifact"
        
        # Determine language from config - can't use Cloud Build substitutions in webhook step
        build_language=$(cat /workspace/config.json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('language', ''))" 2>/dev/null || echo "")
        echo "[Cloud Build] DEBUG: build_language=$$build_language"
        
        # For Node.js builds, also check Node.js status files (they may have different status than Python builds)
        if [[ "$$build_language" == "nodejs" ]]; then
          nodejs_windows_status=$$(cat /workspace/artifacts/build_status_windows 2>/dev/null || echo "pending")
          nodejs_linux_status=$$(cat /workspace/artifacts/build_status_linux 2>/dev/null || echo "pending")
          echo "[Cloud Build] DEBUG: nodejs_windows_status=$$nodejs_windows_status, nodejs_linux_status=$$nodejs_linux_status"
          # Override with Node.js status if available
          if [[ "$$nodejs_windows_status" != "pending" ]]; then
            windows_status=$$nodejs_windows_status
          fi
          if [[ "$$nodejs_linux_status" != "pending" ]]; then
            linux_status=$$nodejs_linux_status
          fi
        fi
        
        # If we have an artifact but status is wrong, fix it
        if [[ -n "$$windows_artifact" && "$$windows_status" == "skipped" ]]; then
          echo "[Cloud Build] DEBUG: Fixing windows_status (had artifact but status was skipped)"
          windows_status="completed"
        fi
        if [[ -n "$$linux_artifact" && "$$linux_status" == "skipped" ]]; then
          echo "[Cloud Build] DEBUG: Fixing linux_status (had artifact but status was skipped)"
          linux_status="completed"
        fi
        
        linux_error=$$(cat /workspace/artifacts/linux_error 2>/dev/null || echo "")
        windows_error=$$(cat /workspace/artifacts/windows_error 2>/dev/null || echo "")

        echo "[Cloud Build] Linux: $${linux_status}, artifact: $${linux_artifact}"
        echo "[Cloud Build] Windows: $${windows_status}, artifact: $${windows_artifact}"

        if [[ "$$linux_status" == "completed" || "$$windows_status" == "completed" ]]; then
          overall_status="completed"
        elif [[ "$$linux_status" == "skipped" && "$$windows_status" == "skipped" ]]; then
          overall_status="cancelled"
        else
          overall_status="failed"
        fi

        echo "[Cloud Build] Overall: $${overall_status}"

        linux_download_key=""
        windows_download_key=""
        filename=""

        if [[ "$$linux_status" == "completed" && -n "$$linux_artifact" ]]; then
          linux_download_key="builds/${_BUILD_ID}/linux/$$linux_artifact"
          filename="$$linux_artifact"
        fi

        if [[ "$$windows_status" == "completed" && -n "$$windows_artifact" ]]; then
          windows_download_key="builds/${_BUILD_ID}/windows/$$windows_artifact"
          if [[ -z "$$filename" ]]; then
            filename="$$windows_artifact"
          fi
        fi

        error_msg=""
        if [[ "$$overall_status" == "failed" ]]; then
          if [[ -n "$$linux_error" ]]; then error_msg="Linux: $$linux_error; "; fi
          if [[ -n "$$windows_error" ]]; then error_msg="$${error_msg}Windows: $$windows_error"; fi
          if [[ -z "$$error_msg" ]]; then error_msg="Build failed"; fi
        fi

        error_msg_escaped=$$(echo "$$error_msg" | sed 's/"/\\"/g' | tr '\n' ' ')

        # $BUILD_ID is the actual GCP Cloud Build ID (built-in variable)
        # ${_BUILD_ID} is our CodeVault build ID (passed as substitution)
        payload="{\"build_id\":\"${_BUILD_ID}\",\"cloud_build_id\":\"$BUILD_ID\",\"status\":\"$$overall_status\",\"linux_status\":\"$$linux_status\",\"windows_status\":\"$$windows_status\",\"linux_download_key\":\"$$linux_download_key\",\"windows_download_key\":\"$$windows_download_key\",\"filename\":\"$$filename\",\"error\":\"$$error_msg_escaped\",\"timestamp\":$$(date +%s)}"

        if [ -n "$$WEBHOOK_SECRET" ]; then
          sig=$$(echo -n "$$payload" | openssl dgst -sha256 -hmac "$$WEBHOOK_SECRET" | awk '{print $$2}')
        else
          sig=""
        fi

        echo "[Cloud Build] Sending webhook to: ${_CALLBACK_URL}"
        echo "[Cloud Build] Payload: $$payload"

        max_retries=2
        retry_delay=2
        for i in $$(seq 1 $$max_retries); do
          echo "[Cloud Build] Attempt $$i/$$max_retries..."

          if [ -n "$$sig" ]; then
            response=$$(curl -s -w "\n%{http_code}" -X POST "${_CALLBACK_URL}" \
              -H "Content-Type: application/json" \
              -H "X-Signature: $$sig" \
              -d "$$payload" --connect-timeout 5 --max-time 10 2>&1)
          else
            response=$$(curl -s -w "\n%{http_code}" -X POST "${_CALLBACK_URL}" \
              -H "Content-Type: application/json" \
              -d "$$payload" --connect-timeout 5 --max-time 10 2>&1)
          fi

          http_code=$$(echo "$$response" | tail -1)

          echo "[Cloud Build] Response: HTTP $$http_code"

          if [[ "$$http_code" == "200" || "$$http_code" == "201" ]]; then
            echo "[Cloud Build] Success (HTTP $$http_code)"
            break
          else
            echo "[Cloud Build] Failed (HTTP $$http_code)"
            if [[ $$i -lt $$max_retries ]]; then
              echo "[Cloud Build] Retrying in $${retry_delay}s..."
              sleep $$retry_delay
              retry_delay=$$((retry_delay + 2))
            fi
          fi
        done

        echo "[Cloud Build] Webhook completed"
    waitFor: ['save-cache']
    secretEnv: ['WEBHOOK_SECRET']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/CODEVAULT_WEBHOOK_SECRET/versions/latest
    env: 'WEBHOOK_SECRET'
