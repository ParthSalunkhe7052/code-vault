# ============================================
# CodeVault - Google Cloud Build Configuration
# ============================================
# This replaces GitHub Actions for production builds
# Supports multi-platform builds: Windows, Linux, macOS

substitutions:
  _CALLBACK_URL: 'https://api.codevault.parth7.me/api/v1/cloud-build/webhook'
  _TARGET_PLATFORMS: 'linux,windows'
  _LANGUAGE: 'python'
  _GCS_BUCKET: 'codevault-builds'
  _SOURCE_URL: ''
  _CONFIG_URL: ''  # GCS URL to config JSON (avoids 8KB substitution limit)
  _OUTPUT_NAME: 'app'
  _DEBUG_BUILD: 'false'  # Set to 'true' for verbose logging
  _NUITKA_CACHE_DIR: '/workspace/.nuitka-cache'
  _BUILD_ID: 'unknown'
  _PROJECT_ID: 'unknown'

options:
  machineType: 'E2_HIGHCPU_8'  # 8 vCPUs for faster builds
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  pool: {}

timeout: 3600s  # 60 minutes max per build

# ============================================
# Build Steps
# ============================================
steps:
  # ===== STEP 1: Download Source =====
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'download-source'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Use all variables to satisfy API validation
        echo "Building: ${_BUILD_ID} for ${_PROJECT_ID} (${_LANGUAGE})"
        echo "Target: ${_TARGET_PLATFORMS}, Output: ${_OUTPUT_NAME}, Debug: ${_DEBUG_BUILD}"
        
        if [[ "${_SOURCE_URL}" == gs://* ]]; then
          gsutil cp "${_SOURCE_URL}" source.zip
        else
          curl -L -o source.zip "${_SOURCE_URL}"
        fi
    waitFor: ['-']

  # ===== STEP 2: Extract and Normalize Source =====
  - name: 'ubuntu'
    id: 'extract-source'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq unzip > /dev/null 2>&1
        
        echo "[Cloud Build] Extracting source..."
        unzip -q source.zip -d ./extracted
        
        mkdir -p ./project/source
        
        # Normalize directory structure
        if [ -d "./extracted/.github" ]; then
          echo "[Cloud Build] Structure looks correct"
          # Move EVERYTHING including hidden files
          cp -r ./extracted/. ./project/source/
        elif [ -d "./extracted/source" ]; then
          echo "[Cloud Build] Source already in subfolder"
          cp -r ./extracted/source/. ./project/source/
          if [ -d "./extracted/.github" ]; then cp -r ./extracted/.github ./project/source/ 2>/dev/null || true; fi
        else
          echo "[Cloud Build] Flattening structure"
          cp -r ./extracted/. ./project/source/ 2>/dev/null || true
        fi
        
        echo "[Cloud Build] Source prepared successfully"
    waitFor: ['download-source']

  # ===== STEP 3: Download config once for all platforms =====
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'download-config'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "${_TARGET_PLATFORMS}" == "" ]]; then
          echo "[Cloud Build] No target platforms specified"
          exit 0
        fi
        echo "[Cloud Build] Downloading build config..."
        if gsutil cp "${_CONFIG_URL}" /workspace/config.json; then
          echo "[Cloud Build] Config ready for all platforms"
        else
          echo "[Cloud Build] ERROR: Config download failed"
          exit 1
        fi
    waitFor: ['extract-source']

  # ===== STEP 4: Build for Linux (Python) =====
  - name: 'python:3.11-slim'
    id: 'build-linux'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        # Check platform and language
        if [[ "${_TARGET_PLATFORMS}" != *"linux"* || "${_LANGUAGE}" != "python" ]]; then
          echo "[Cloud Build] Skipping Linux build (not Python or not in target)"
          echo "skipped" > /workspace/build_status_linux
          exit 0
        fi

        echo "[Cloud Build] ===== Building for Linux ====="

        # Install build dependencies
        apt-get update -qq && apt-get install -y -qq patchelf build-essential ccache > /dev/null 2>&1

        # Install Python build tools
        pip install --quiet --disable-pip-version-check nuitka ordered-set zstandard requests cryptography

        # Validate cloud_runner.py exists
        if [ ! -f "./project/source/.github/scripts/cloud_runner.py" ]; then
          echo "[Cloud Build] ERROR: cloud_runner.py not found in source package"
          echo "cloud_runner.py not found in source package" > /workspace/project/source/error_message.txt
          exit 1
        fi

        # Load config
        decoded_config=$$(cat /workspace/config.json)

        # Run runner
        python3 "./project/source/.github/scripts/cloud_runner.py" \
          --config "$$decoded_config" \
          --source "./project/source" || echo "Linux build failed (continuing)"

        # Package output
        cd "./project/source"
        output_name="${_OUTPUT_NAME}"
        # Look in platform-specific output dir
        if [ -d "build_output_linux" ]; then
          cp -r build_output_linux/* .
        fi

        linux_artifacts=""
        linux_status="failed"
        linux_error=""

        if [ -f "$$output_name" ]; then
          chmod +x "$$output_name"
          tar -czf "$$output_name-linux.tar.gz" "$$output_name"
          mkdir -p /workspace/artifacts
          mv "$$output_name-linux.tar.gz" /workspace/artifacts/
          linux_artifacts="$$output_name-linux.tar.gz"
          linux_status="completed"
        else
          if [ -f "error_message.txt" ]; then
            linux_error=$$(cat error_message.txt)
          else
            linux_error="Linux build completed but output file not found"
          fi
        fi

        # Write status file for webhook callback
        echo "$$linux_status" > /workspace/build_status_linux
        echo "$$linux_artifacts" > /workspace/linux_artifacts
        echo "$$linux_error" > /workspace/linux_error
    waitFor: ['download-config']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  # ===== STEP 4a: Upload Linux Artifact =====
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'upload-linux'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        linux_status=$$(cat /workspace/build_status_linux 2>/dev/null || echo "pending")
        if [[ "$$linux_status" != "completed" ]]; then
          echo "[Cloud Build] Skipping Linux upload (build not completed)"
          exit 0
        fi

        linux_artifact=$$(cat /workspace/linux_artifacts 2>/dev/null)
        if [ -z "$$linux_artifact" ]; then
          echo "[Cloud Build] No Linux artifact to upload"
          exit 0
        fi

        echo "[Cloud Build] Uploading Linux artifact: $$linux_artifact"
        gsutil cp "/workspace/artifacts/$$linux_artifact" "gs://${_GCS_BUCKET}/builds/${_BUILD_ID}/linux/$$linux_artifact" || {
          echo "[Cloud Build] Failed to upload Linux artifact"
          exit 1
        }
        echo "[Cloud Build] Linux artifact uploaded successfully"
    waitFor: ['build-linux']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  # ===== STEP 4b: Build for Windows (Python) =====
  - name: 'docker.io/tobix/pywine:3.11'
    id: 'build-windows'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        # Check platform and language
        if [[ "${_TARGET_PLATFORMS}" != *"windows"* || "${_LANGUAGE}" != "python" ]]; then
          echo "[Cloud Build] Skipping Windows build (not Python or not in target)"
          echo "skipped" > /workspace/build_status_windows
          exit 0
        fi

        echo "[Cloud Build] ===== Building for Windows ====="

        # Rick Hack: Force Nuitka cache and dummy bypass
        export NUITKA_CACHE_DIR=${_NUITKA_CACHE_DIR}
        mkdir -p $$NUITKA_CACHE_DIR

        # Install deps in Wine
        wine python -m pip install --upgrade --quiet --disable-pip-version-check \
          nuitka ordered-set zstandard requests cryptography pefile

        # Validate cloud_runner.py exists
        if [ ! -f "./project/source/.github/scripts/cloud_runner.py" ]; then
          echo "[Cloud Build] ERROR: cloud_runner.py not found in source package"
          echo "cloud_runner.py not found in source package" > ./project/source/error_message.txt
          exit 1
        fi

        # Rick Hack: Monkey-patch Nuitka using versioned script
        nuitka_depends_py=$$(find /opt/wineprefix -name "DependsExe.py" | grep "freezer" | head -1)

        if [ -n "$$nuitka_depends_py" ]; then
          echo "[Cloud Build] Patching Nuitka at: $$nuitka_depends_py"
          if [ -f "./project/source/.github/scripts/nuitka_patch.py" ]; then
            wine python "./project/source/.github/scripts/nuitka_patch.py" "$$nuitka_depends_py"
            echo "[Cloud Build] Patch applied successfully"
          else
            echo "[Cloud Build] WARNING: nuitka_patch.py not found, skipping patch"
          fi
        else
          echo "[Cloud Build] WARNING: DependsExe.py not found, skipping patch"
        fi

        # Run runner
        decoded_config=$$(cat /workspace/config.json)
        wine python "./project/source/.github/scripts/cloud_runner.py" \
          --config "$$decoded_config" \
          --source "$$(winepath -w $$(realpath ./project/source))"

        # Package output
        output_name="${_OUTPUT_NAME}"
        # Look in platform-specific output dir
        if [ -d "./project/source/build_output_windows_wine" ]; then
          cp -r ./project/source/build_output_windows_wine/* ./project/source/
        fi

        windows_artifacts=""
        windows_status="failed"
        windows_error=""

        if [ -f "./project/source/$$output_name.exe" ]; then
          zip -q "$$output_name-windows.zip" "./project/source/$$output_name.exe"
          mkdir -p /workspace/artifacts
          mv "$$output_name-windows.zip" /workspace/artifacts/
          windows_artifacts="$$output_name-windows.zip"
          windows_status="completed"
        else
          if [ -f "./project/source/error_message.txt" ]; then
            windows_error=$$(cat ./project/source/error_message.txt)
          else
            windows_error="Windows build completed but output file not found"
          fi
        fi

        # Write status file for webhook callback
        echo "$$windows_status" > /workspace/build_status_windows
        echo "$$windows_artifacts" > /workspace/windows_artifacts
        echo "$$windows_error" > /workspace/windows_error
    waitFor: ['download-config']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  # ===== STEP 4c: Upload Windows Artifact =====
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'upload-windows'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        windows_status=$$(cat /workspace/build_status_windows 2>/dev/null || echo "pending")
        if [[ "$$windows_status" != "completed" ]]; then
          echo "[Cloud Build] Skipping Windows upload (build not completed)"
          exit 0
        fi

        windows_artifact=$$(cat /workspace/windows_artifacts 2>/dev/null)
        if [ -z "$$windows_artifact" ]; then
          echo "[Cloud Build] No Windows artifact to upload"
          exit 0
        fi

        echo "[Cloud Build] Uploading Windows artifact: $$windows_artifact"
        gsutil cp "/workspace/artifacts/$$windows_artifact" "gs://${_GCS_BUCKET}/builds/${_BUILD_ID}/windows/$$windows_artifact" || {
          echo "[Cloud Build] Failed to upload Windows artifact"
          exit 1
        }
        echo "[Cloud Build] Windows artifact uploaded successfully"
    waitFor: ['build-windows']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  # ===== STEP 5: Build for Node.js =====
  - name: 'node:20-slim'
    id: 'build-nodejs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        if [[ "${_LANGUAGE}" != "nodejs" ]]; then
          echo "[Cloud Build] Skipping Node.js build"
          exit 0
        fi
        
        echo "[Cloud Build] ===== Building for Node.js ====="
        npm install -g @yao-pkg/pkg --quiet
        cd "./project/source"
        if [ -f "package.json" ]; then npm install --quiet; fi
        
        mkdir -p /workspace/artifacts
        pkg . --target node20-linux-x64,node20-win-x64 --out-path /workspace/artifacts/
        
        echo "completed" > /workspace/build_status_linux
        echo "completed" > /workspace/build_status_windows
    waitFor: ['download-config']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  # ===== STEP 7: Send Webhook Callback =====
  - name: 'gcr.io/cloud-builders/curl'
    id: 'webhook-callback'
    entrypoint: 'bash'
    secretEnv: ['_CALLBACK_SECRET']
    args:
      - '-c'
      - |
        set +e

        # Read status files
        linux_status=$$(cat /workspace/build_status_linux 2>/dev/null || echo "pending")
        windows_status=$$(cat /workspace/build_status_windows 2>/dev/null || echo "pending")

        # Read artifact names
        linux_artifact=$$(cat /workspace/linux_artifacts 2>/dev/null || echo "")
        windows_artifact=$$(cat /workspace/windows_artifacts 2>/dev/null || echo "")

        # Read errors
        linux_error=$$(cat /workspace/linux_error 2>/dev/null || echo "")
        windows_error=$$(cat /workspace/windows_error 2>/dev/null || echo "")

        # Compute overall status
        all_skipped=true
        if [[ "$$linux_status" != "skipped" ]]; then all_skipped=false; fi
        if [[ "$$windows_status" != "skipped" ]]; then all_skipped=false; fi

        if [[ "$$all_skipped" == "true" ]]; then
          overall_status="cancelled"
        elif [[ "$$linux_status" == "completed" || "$$windows_status" == "completed" ]]; then
          overall_status="completed"
        else
          overall_status="failed"
        fi

        # Build GCS blob keys for server-side URL generation
        linux_download_key=""
        windows_download_key=""
        filename=""

        if [[ "$$linux_status" == "completed" && -n "$$linux_artifact" ]]; then
          linux_download_key="builds/${_BUILD_ID}/linux/$$linux_artifact"
          filename="$$linux_artifact"
        fi

        if [[ "$$windows_status" == "completed" && -n "$$windows_artifact" ]]; then
          windows_download_key="builds/${_BUILD_ID}/windows/$$windows_artifact"
          if [[ -z "$$filename" ]]; then
            filename="$$windows_artifact"
          fi
        fi

        # Build error message
        error_msg=""
        if [[ "$$overall_status" == "failed" ]]; then
          if [[ -n "$$linux_error" ]]; then error_msg="Linux: $$linux_error; "; fi
          if [[ -n "$$windows_error" ]]; then error_msg="$${error_msg}Windows: $$windows_error"; fi
          if [[ -z "$$error_msg" ]]; then error_msg="Build failed - see logs for details"; fi
        fi

        # Build the payload with GCS blob keys instead of URLs
        payload='{"build_id":"'"${_BUILD_ID}"'","cloud_build_id":"'"${_BUILD_ID}"'","status":"'"$$overall_status"'","linux_status":"'"$$linux_status"'","windows_status":"'"$$windows_status"'","linux_download_key":"'"$$linux_download_key"'","windows_download_key":"'"$$windows_download_key"'","filename":"'"$$filename"'","error":"'"$$error_msg"'","timestamp":'"$$(date +%s)"'}'
        sig=$$(echo -n "$$payload" | openssl dgst -sha256 -hmac "$$_CALLBACK_SECRET" | awk '{print $$2}')

        echo "[Cloud Build] Sending webhook callback..."
        echo "[Cloud Build] Payload: $$payload"

        # Retry logic with exponential backoff (A7)
        max_retries=3
        retry_delay=5
        for i in $(seq 1 $$max_retries); do
          echo "[Cloud Build] Webhook attempt $$i/$$max_retries..."
          if curl -sf -X POST "${_CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $$sig" \
            -d "$$payload"; then
            echo "[Cloud Build] Webhook succeeded on attempt $$i"
            break
          else
            if [[ $$i -lt $$max_retries ]]; then
              echo "[Cloud Build] Webhook failed, retrying in $${retry_delay}s..."
              sleep $$retry_delay
              retry_delay=$$((retry_delay * 2))  # Exponential backoff
            else
              echo "[Cloud Build] Webhook failed after $$max_retries attempts"
            fi
          fi
        done

        echo "[Cloud Build] Webhook callback completed"
    waitFor: ['upload-linux', 'upload-windows', 'build-nodejs']

# ===== Secrets Configuration =====
availableSecrets:
  secretManager:
    - versionName: projects/cloudbuild-486309/secrets/callback-webhook-secret/versions/latest
      env: '_CALLBACK_SECRET'
