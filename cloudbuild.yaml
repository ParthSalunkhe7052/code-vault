# ============================================
# CodeVault - Google Cloud Build Configuration
# ============================================
# This replaces GitHub Actions for production builds
# Supports multi-platform builds: Windows, Linux, macOS

substitutions:
  # Build parameters (passed from API)
  _BUILD_ID: 'unknown'
  _PROJECT_ID: 'unknown'
  _LANGUAGE: 'python'
  _TARGET_PLATFORMS: 'windows,linux,macos'
  _SOURCE_URL: ''
  _CONFIG_URL: ''  # GCS URL to config JSON (avoids 8KB substitution limit)
  _CALLBACK_URL: ''
  _OUTPUT_NAME: 'app'

options:
  machineType: 'E2_HIGHCPU_8'  # 8 vCPUs for faster builds
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  pool: {}

timeout: 3600s  # 60 minutes max per build

# ============================================
# Build Steps
# ============================================
steps:
  # ===== STEP 0: Restore pip cache from GCS =====
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'restore-pip-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "[Cloud Build] Restoring pip cache..."
        mkdir -p /root/.cache/pip
        gsutil -q cp gs://codevault-builds/cache/pip-cache.tar.gz /tmp/ 2>/dev/null && \
          tar -xzf /tmp/pip-cache.tar.gz -C /root/.cache/ && \
          echo "[Cloud Build] Pip cache restored" || \
          echo "[Cloud Build] No pip cache found (first build)"
    waitFor: ['-']

  # ===== STEP 0b: Restore ccache from GCS =====
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'restore-ccache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "[Cloud Build] Restoring ccache..."
        mkdir -p /workspace/.ccache
        gsutil -q cp gs://codevault-builds/cache/ccache-${_LANGUAGE}.tar.gz /tmp/ 2>/dev/null && \
          tar -xzf /tmp/ccache-${_LANGUAGE}.tar.gz -C /workspace/.ccache/ && \
          echo "[Cloud Build] ccache restored" || \
          echo "[Cloud Build] No ccache found (first build)"
    waitFor: ['-']

  # ===== STEP 1: Download Source =====
  - name: 'gcr.io/cloud-builders/curl'
    id: 'download-source'
    args:
      - '-L'
      - '-o'
      - 'source.zip'
      - '${_SOURCE_URL}'
    waitFor: ['-']

  # ===== STEP 2: Extract and Normalize Source =====
  - name: 'ubuntu'
    id: 'extract-source'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        apt-get update -qq && apt-get install -y -qq unzip > /dev/null 2>&1
        
        echo "[Cloud Build] Extracting source..."
        unzip -q source.zip -d ./project || exit 1
        
        # Normalize directory structure (match GitHub Actions logic)
        if [ -d "./project/source" ]; then
          echo "[Cloud Build] Source directory found at ./project/source"
        elif [ "$(find ./project -maxdepth 1 -type f 2>/dev/null | wc -l)" -gt 0 ]; then
          echo "[Cloud Build] Source files in ./project root, moving to source subfolder"
          mkdir -p ./project/source
          find ./project -maxdepth 1 -type f -exec mv {} ./project/source/ \;
        else
          subfolders=$(find ./project -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l)
          if [ "$subfolders" -eq 1 ]; then
            subfolder=$(find ./project -maxdepth 1 -mindepth 1 -type d | head -1)
            mv "$subfolder" ./project/source
          else
            echo "[Cloud Build] ERROR: Could not determine source structure"
            ls -la ./project
            exit 1
          fi
        fi
        
        echo "[Cloud Build] Source prepared successfully"
        
        # Verify cloud_runner.py exists
        if [ -f "./project/source/.github/scripts/cloud_runner.py" ]; then
          echo "[Cloud Build] cloud_runner.py found in source bundle"
        else
          echo "[Cloud Build] WARNING: cloud_runner.py not found in expected location"
          find ./project -name "cloud_runner.py" 2>/dev/null || echo "Script not found anywhere"
        fi
    waitFor: ['download-source']

  # ===== STEP 3: Download config for Linux build =====
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'download-config-linux'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "${_TARGET_PLATFORMS}" != *"linux"* ]]; then
          echo "[Cloud Build] Skipping config download for Linux"
          exit 0
        fi
        echo "[Cloud Build] Downloading config for Linux build..."
        gsutil cp "${_CONFIG_URL}" /workspace/config.json
        echo "[Cloud Build] Config downloaded successfully"
    waitFor: ['extract-source']

  # ===== STEP 4: Build for Linux (Native) =====
  - name: 'python:3.11-slim'
    id: 'build-linux'
    entrypoint: 'bash'
    env:
      - 'CCACHE_DIR=/workspace/.ccache'
    args:
      - '-c'
      - |
        set -e
        
        # Check if Linux build is requested
        if [[ "${_TARGET_PLATFORMS}" != *"linux"* ]]; then
          echo "[Cloud Build] Skipping Linux build (not in target platforms)"
          exit 0
        fi
        
        echo "[Cloud Build] ===== Building for Linux ====="
        
        # Install build dependencies
        apt-get update -qq && apt-get install -y -qq \
          patchelf \
          build-essential \
          ccache \
          > /dev/null 2>&1
        
        # Install Python build tools (using cache if available)
        pip install --quiet --disable-pip-version-check \
          nuitka \
          ordered-set \
          zstandard \
          requests \
          cryptography
        
        # Load config from workspace (downloaded in previous step)
        decoded_config=$(cat /workspace/config.json)
        echo "[Cloud Build] Config loaded successfully"
        
        # Find cloud_runner.py and determine source directory
        echo "[Cloud Build] Looking for cloud_runner.py..."
        if [ -f "/workspace/project/.github/scripts/cloud_runner.py" ]; then
          runner="/workspace/project/.github/scripts/cloud_runner.py"
          echo "[Cloud Build] Found cloud_runner.py at /workspace/project/.github/scripts/"
        else
          echo "[Cloud Build] ERROR: cloud_runner.py not found"
          find /workspace/project -name "cloud_runner.py" 2>/dev/null || echo "Script not found anywhere"
          exit 1
        fi
        
        # Determine actual source directory (where the Python files are)
        if [ -d "./project/source" ]; then
          src_dir="./project/source"
          echo "[Cloud Build] Using source directory: project/source/"
        else
          src_dir="./project"
          echo "[Cloud Build] Using source directory: project/"
        fi
        echo "[Cloud Build] Build script found"
        
        # Create artifacts directory
        mkdir -p /workspace/artifacts
        
        # Debug: Show source directory contents
        echo "[Cloud Build] Source directory: $src_dir"
        echo "[Cloud Build] Contents of source directory:"
        ls -la "$src_dir"
        echo "[Cloud Build] Python files in source:"
        find "$src_dir" -name "*.py" -type f 2>/dev/null | head -10
        
        # Run cloud_runner.py with decoded config and error handling
        set +e
        python3 "$runner" \
          --config "$decoded_config" \
          --source "$src_dir"
        build_exit_code=$?
        set -e
        
        if [ $build_exit_code -ne 0 ]; then
          echo "[Cloud Build] ERROR: Linux build failed with exit code $build_exit_code"
          echo "failed" > /workspace/build_status_linux
          echo "Build failed - see logs above" > /workspace/build_error_linux
          exit 1
        fi
        
        # Package output
        cd "$src_dir"
        if [ -d "build_output" ]; then
          cp -r build_output/* .
        fi
        
        output_name="${_OUTPUT_NAME}"
        
        # Find the executable
        if [ -f "$output_name" ]; then
          chmod +x "$output_name"
          echo "[Cloud Build] Found executable: $output_name"
          tar -czf "${output_name}-linux.tar.gz" "$output_name"
          mv "${output_name}-linux.tar.gz" /workspace/artifacts/
          echo "[Cloud Build] Linux build complete"
          echo "completed" > /workspace/build_status_linux
        elif [ -d "build" ]; then
          # Fast build mode - zip the directory
          tar -czf "${output_name}-linux.tar.gz" build
          mv "${output_name}-linux.tar.gz" /workspace/artifacts/
          echo "[Cloud Build] Linux build complete (fast mode)"
          echo "completed" > /workspace/build_status_linux
        else
          echo "[Cloud Build] ERROR: No output found for Linux build"
          ls -la
          echo "failed" > /workspace/build_status_linux
          echo "No build output found" > /workspace/build_error_linux
          exit 1
        fi
    waitFor: ['extract-source', 'restore-pip-cache', 'restore-ccache']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  # ===== STEP 3b: Download config for Windows build =====
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'download-config-windows'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [[ "${_TARGET_PLATFORMS}" != *"windows"* ]]; then
          echo "[Cloud Build] Skipping config download for Windows"
          exit 0
        fi
        echo "[Cloud Build] Downloading config for Windows build..."
        gsutil cp "${_CONFIG_URL}" /workspace/config.json
        echo "[Cloud Build] Config downloaded successfully"
    waitFor: ['extract-source']

  # ===== STEP 4: Build for Windows (using Wine) =====
  - name: 'docker.io/tobix/pywine:3.11'
    id: 'build-windows'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        
        # Check if Windows build is requested
        if [[ "${_TARGET_PLATFORMS}" != *"windows"* ]]; then
          echo "[Cloud Build] Skipping Windows build (not in target platforms)"
          exit 0
        fi
        
        echo "[Cloud Build] ===== Building for Windows ====="
        
        # Load config from workspace (downloaded in previous step)
        decoded_config=$(cat /workspace/config.json)
        echo "[Cloud Build] Config loaded successfully"
        
        # Find cloud_runner.py and determine source directory
        echo "[Cloud Build] Looking for cloud_runner.py..."
        if [ -f "/workspace/project/.github/scripts/cloud_runner.py" ]; then
          runner_path="/workspace/project/.github/scripts/cloud_runner.py"
          echo "[Cloud Build] Found cloud_runner.py at /workspace/project/.github/scripts/"
        else
          echo "[Cloud Build] ERROR: cloud_runner.py not found"
          find /workspace/project -name "cloud_runner.py" 2>/dev/null || echo "Script not found anywhere"
          exit 1
        fi
        
        # Determine actual source directory (where the Python files are)
        if [ -d "./project/source" ]; then
          src_dir="./project/source"
          echo "[Cloud Build] Using source directory: project/source/"
        else
          src_dir="./project"
          echo "[Cloud Build] Using source directory: project/"
        fi
        echo "[Cloud Build] Build script found"
        
        # Install Nuitka in Wine Python environment
        wine python -m pip install --quiet --disable-pip-version-check \
          nuitka \
          ordered-set \
          zstandard \
          requests \
          cryptography
        
        # Create artifacts directory
        mkdir -p /workspace/artifacts
        
        # Build using Wine with decoded config
        # Note: wine needs absolute paths, not relative
        src_path=$(realpath "$src_dir")
        echo "[Cloud Build] Source path: $src_path"
        echo "[Cloud Build] Contents of source directory:"
        ls -la "$src_dir"
        echo "[Cloud Build] Python files in source:"
        find "$src_path" -name "*.py" -type f 2>/dev/null | head -10
        
        # Change to source directory for the build
        cd "$src_dir"
        
        # Run cloud_runner with error handling
        # Use winepath to convert Linux path to Windows path
        win_path=$(winepath -w "$src_path" 2>/dev/null || echo "$src_path")
        echo "[Cloud Build] Windows path: $win_path"
        
        set +e
        wine python "$runner_path" \
          --config "$decoded_config" \
          --source "$win_path"
        build_exit_code=$?
        set -e
        
        if [ $build_exit_code -ne 0 ]; then
          echo "[Cloud Build] ERROR: Windows build failed with exit code $build_exit_code"
          # Save error status for webhook
          echo "failed" > /workspace/build_status_windows
          echo "Build failed - see logs above" > /workspace/build_error_windows
          exit 1
        fi
        
        # Package output
        if [ -d "build_output" ]; then
          cp -r build_output/* .
        fi
        
        output_name="${_OUTPUT_NAME}"
        
        if [ -f "${output_name}.exe" ]; then
          echo "[Cloud Build] Found executable: ${output_name}.exe"
          zip -q "${output_name}-windows.zip" "${output_name}.exe"
          mv "${output_name}-windows.zip" /workspace/artifacts/
          echo "[Cloud Build] Windows build complete"
          echo "completed" > /workspace/build_status_windows
        elif [ -d "build" ]; then
          # Fast build mode
          zip -qr "${output_name}-windows.zip" build
          mv "${output_name}-windows.zip" /workspace/artifacts/
          echo "[Cloud Build] Windows build complete (fast mode)"
          echo "completed" > /workspace/build_status_windows
        else
          echo "[Cloud Build] ERROR: No output found for Windows build"
          ls -la
          echo "failed" > /workspace/build_status_windows
          echo "No build output found" > /workspace/build_error_windows
          exit 1
        fi
    waitFor: ['extract-source']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  # ===== STEP 5: Build for macOS (Cross-compilation) =====
  # NOTE: macOS cross-compilation is limited. Skip gracefully if requested.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-macos'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Check if macOS build is requested - skip immediately if not
        if [[ "${_TARGET_PLATFORMS}" != *"macos"* ]]; then
          echo "[Cloud Build] Skipping macOS build (not in target platforms)"
          exit 0
        fi
        
        echo "[Cloud Build] ===== macOS Build ====="
        echo "[Cloud Build] WARNING: macOS cross-compilation not supported in Cloud Build"
        echo "[Cloud Build] macOS builds require native macOS runners (GitHub Actions recommended)"
        
        # Exit 0 to not fail the build - macOS is optional
        exit 0
    waitFor: ['extract-source']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  # ===== STEP 6: Upload to Google Cloud Storage =====
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'upload-artifacts'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        
        echo "[Cloud Build] ===== Uploading Artifacts to GCS ====="
        
        cd /workspace/artifacts
        
        # Check if any artifacts exist
        artifact_count=$(ls -1 *.tar.gz *.zip 2>/dev/null | wc -l || echo 0)
        
        if [ "$artifact_count" -eq 0 ]; then
          echo "[Cloud Build] ERROR: No artifacts found to upload"
          ls -la
          exit 1
        fi
        
        # Upload each artifact to the appropriate platform folder
        for file in *.tar.gz *.zip; do
          if [ -f "$file" ]; then
            # Extract platform from filename (e.g., app-linux.tar.gz -> linux)
            if [[ "$file" == *"linux"* ]]; then
              platform="linux"
            elif [[ "$file" == *"windows"* ]]; then
              platform="windows"
            elif [[ "$file" == *"macos"* ]]; then
              platform="macos"
            else
              platform="unknown"
            fi
            
            dest="gs://codevault-builds/builds/${_BUILD_ID}/$platform/$file"
            echo "[Cloud Build] Uploading: $file -> $platform/"
            gsutil cp "$file" "$dest"
            
            echo "[Cloud Build] Uploaded: $file"
          fi
        done
        
        echo "[Cloud Build] ===== Upload Complete ====="
    waitFor: ['build-linux', 'build-windows', 'build-macos']
    volumes:
      - name: 'artifacts'
        path: '/workspace/artifacts'

  # ===== STEP 7: Save pip cache for future builds =====
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'save-pip-cache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "[Cloud Build] Saving pip cache..."
        if [ -d "/root/.cache/pip" ]; then
          tar -czf /tmp/pip-cache.tar.gz -C /root/.cache pip 2>/dev/null && \
            gsutil -q cp /tmp/pip-cache.tar.gz gs://codevault-builds/cache/ && \
            echo "[Cloud Build] Pip cache saved" || \
            echo "[Cloud Build] Failed to save pip cache (non-critical)"
        else
          echo "[Cloud Build] No pip cache to save"
        fi
    waitFor: ['build-linux', 'build-windows']

  # ===== STEP 8: Save ccache for future builds =====
  - name: 'gcr.io/cloud-builders/gsutil'
    id: 'save-ccache'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "[Cloud Build] Saving ccache..."
        if [ -d "/workspace/.ccache" ] && [ "$(ls -A /workspace/.ccache 2>/dev/null)" ]; then
          tar -czf /tmp/ccache-${_LANGUAGE}.tar.gz -C /workspace/.ccache . 2>/dev/null && \
            gsutil -q cp /tmp/ccache-${_LANGUAGE}.tar.gz gs://codevault-builds/cache/ && \
            echo "[Cloud Build] ccache saved" || \
            echo "[Cloud Build] Failed to save ccache (non-critical)"
        else
          echo "[Cloud Build] No ccache to save"
        fi
    waitFor: ['build-linux', 'build-windows']

  # ===== STEP 9: Send Webhook Callback =====
  # This step runs regardless of build success/failure to report status
  - name: 'gcr.io/cloud-builders/curl'
    id: 'webhook-callback'
    entrypoint: 'bash'
    secretEnv: ['_CALLBACK_SECRET']
    args:
      - '-c'
      - |
        # Don't exit on error - we want to report status even if builds failed
        set +e
        
        echo "[Cloud Build] ===== Sending Webhook Callback ====="
        
        # Determine status from build status files
        linux_status=$(cat /workspace/build_status_linux 2>/dev/null || echo "pending")
        windows_status=$(cat /workspace/build_status_windows 2>/dev/null || echo "pending")
        
        # Read error messages if builds failed
        linux_error=$(cat /workspace/build_error_linux 2>/dev/null || echo "")
        windows_error=$(cat /workspace/build_error_windows 2>/dev/null || echo "")
        
        # Determine overall build status
        if [[ "${linux_status}" == "failed" || "${windows_status}" == "failed" ]]; then
          overall_status="failed"
        else
          overall_status="completed"
        fi
        
        echo "[Cloud Build] Build statuses - Linux: ${linux_status}, Windows: ${windows_status}, Overall: ${overall_status}"
        
        # Send individual platform webhooks for each platform in target
        if [[ "${_TARGET_PLATFORMS}" == *"linux"* ]]; then
          echo "[Cloud Build] Reporting Linux status: ${linux_status}"
          if [ "${linux_status}" == "failed" ]; then
            error_msg="${linux_error:-Build failed}"
          else
            error_msg=""
          fi
          
          payload_linux='{"build_id":"'"${_BUILD_ID}"'","platform":"linux","status":"'"${linux_status}"'","download_key":"builds/'"${_BUILD_ID}"'/linux/'"${_OUTPUT_NAME}"'-linux.tar.gz","filename":"'"${_OUTPUT_NAME}"'-linux.tar.gz","error":"'"${error_msg}"'","timestamp":'"$(date +%s)"',"cloud_build_id":"'"${BUILD_ID}"'"}'
          sig_linux=$(echo -n "$payload_linux" | openssl dgst -sha256 -hmac "$$_CALLBACK_SECRET" | awk '{print $2}')
          
          curl -sf -X POST "${_CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $sig_linux" \
            -H "X-Cloud-Build-ID: ${BUILD_ID}" \
            --connect-timeout 10 \
            -d "$payload_linux" || echo "[Cloud Build] Linux webhook failed (non-critical)"
        fi
        
        if [[ "${_TARGET_PLATFORMS}" == *"windows"* ]]; then
          echo "[Cloud Build] Reporting Windows status: ${windows_status}"
          if [ "${windows_status}" == "failed" ]; then
            error_msg="${windows_error:-Build failed}"
          else
            error_msg=""
          fi
          
          payload_windows='{"build_id":"'"${_BUILD_ID}"'","platform":"windows","status":"'"${windows_status}"'","download_key":"builds/'"${_BUILD_ID}"'/windows/'"${_OUTPUT_NAME}"'-windows.zip","filename":"'"${_OUTPUT_NAME}"'-windows.zip","error":"'"${error_msg}"'","timestamp":'"$(date +%s)"',"cloud_build_id":"'"${BUILD_ID}"'"}'
          sig_windows=$(echo -n "$payload_windows" | openssl dgst -sha256 -hmac "$$_CALLBACK_SECRET" | awk '{print $2}')
          
          curl -sf -X POST "${_CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $sig_windows" \
            -H "X-Cloud-Build-ID: ${BUILD_ID}" \
            --connect-timeout 10 \
            -d "$payload_windows" || echo "[Cloud Build] Windows webhook failed (non-critical)"
        fi
        
        # Send overall completion webhook
        payload='{"build_id":"'"${_BUILD_ID}"'","project_id":"'"${_PROJECT_ID}"'","status":"'"${overall_status}"'","gcs_bucket":"codevault-builds","gcs_path":"builds/'"${_BUILD_ID}"'/","platforms":"'"${_TARGET_PLATFORMS}"'","timestamp":'"$(date +%s)"',"cloud_build_id":"'"${BUILD_ID}"'","logs_url":"https://console.cloud.google.com/cloud-build/builds/'"${BUILD_ID}"'?project=cloudbuild-486309"}'
        
        sig_overall=$(echo -n "$payload" | openssl dgst -sha256 -hmac "$$_CALLBACK_SECRET" | awk '{print $2}')
        
        echo "[Cloud Build] Sending overall status: ${overall_status}"
        
        max_retries=3
        retry_count=0
        success=false
        
        while [ "$success" = "false" ] && [ $retry_count -lt $max_retries ]; do
          if curl -sf -X POST "${_CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $sig_overall" \
            -H "X-Cloud-Build-ID: ${BUILD_ID}" \
            --connect-timeout 10 \
            -d "$payload"; then
            success=true
            echo "[Cloud Build] Overall webhook delivered successfully"
          else
            retry_count=$((retry_count + 1))
            echo "[Cloud Build] Overall webhook failed (attempt $retry_count/$max_retries)"
            sleep 2
          fi
        done
        
        if [ "$success" = "false" ]; then
          echo "[Cloud Build] WARNING: Overall webhook delivery failed after $max_retries attempts"
        fi
        
        # Always exit successfully - webhook failure shouldn't fail the build
        exit 0
    waitFor: ['build-linux', 'build-windows', 'upload-artifacts']

# ===== Secrets Configuration =====
availableSecrets:
  secretManager:
    - versionName: projects/cloudbuild-486309/secrets/callback-webhook-secret/versions/latest
      env: '_CALLBACK_SECRET'

# ===== Build Artifacts (optional - for Cloud Build UI) =====
artifacts:
  objects:
    location: 'gs://codevault-builds/builds/${_BUILD_ID}/'
    paths: ['*.tar.gz', '*.zip']
