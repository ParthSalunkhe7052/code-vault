server {
    listen 80;
    server_name api.codevault.parth7.me;

    # Redirect all HTTP to HTTPS (after SSL is configured)
    # return 301 https://$server_name$request_uri;

    # Temporarily allow HTTP for Certbot verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy to Docker container
    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # File upload limit (500MB for code uploads)
        client_max_body_size 500M;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/codevault-access.log;
    error_log /var/log/nginx/codevault-error.log;
}

# HTTPS configuration (will be auto-added by Certbot)
# After running: certbot --nginx -d api.codevault.parth7.me
# Certbot will automatically create the SSL server block
